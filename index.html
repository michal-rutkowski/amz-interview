    + '<div class="say-out-loud"><div class="mono"><span class="en">Say this out loud</span><span class="jp">面接でそのまま口に出す一言</span></div>'
    + '<p><span class="en">"Let me sketch the high-level flow first, then I\'ll deep-dive into whichever part seems most useful to you, and close with the trade-offs I considered along the way."</span>'
    + '<span class="jp">「まず高レベルな流れをスケッチさせてください。その後、あなたにとって最も有用と思われる部分を深掘りし、最後に検討したトレードオフで締めくくります。」</span></p></div>'
    + '</div>';
  },
  '7-45': function(){ return ''
    + '<div style="'+styleFor('olive')+'">'
    + '<div class="sheet-tag mono">SHEET 3 / 4</div>'
    + '<div class="sheet-eyebrow"><span class="en">2.3 · Narrating &amp; Handling Unknowns</span><span class="jp">2.3・説明の仕方と未知の質問</span></div>'
    + '<h2 class="sec-headline"><span class="en">Say what you\'re thinking, especially when you\'re stuck</span><span class="jp">考えていることを言葉にする。特に詰まったときこそ</span></h2>'
    + '<p class="sec-intro"><span class="en">A whiteboard interview is one of the few technical evaluation formats where the interviewer can\'t actually see the reasoning happening, only the final marks on the board and whatever gets said out loud, which makes narration a genuinely different skill from simply knowing the right answer. A candidate who draws in silence for two minutes and then reveals a correct design has, from the interviewer\'s side, produced no evidence of the reasoning process at all, only the outcome, and outcomes without visible reasoning are hard to distinguish from lucky guesses or memorized templates. This matters even more when a follow-up question hits unfamiliar territory, which happens to nearly everyone at some point in a real interview loop. The instinct to go quiet or bluff through it is exactly the wrong move for a role that\'s fundamentally about communicating technical judgment to people who aren\'t going to independently verify every claim. The honest handling of a genuine unknown, done well, often reads as more senior than confidently answering something rehearsed, because it demonstrates the actual skill being hired for: reasoning in real time under uncertainty, out loud, in front of someone. This sheet covers both halves of that skill, keeping a steady narration going while drawing, and specifically what to do the moment a question lands on something not actually known.</span>'
    + '<span class="jp">ホワイトボード面接は、面接官が実際に起きている思考プロセスを見ることができず、盤面に残る最終的な跡と、口に出された言葉だけしか見えない、数少ない技術評価形式の1つである。これにより、ナレーション（説明しながら進めること）は、単に正しい答えを知っていることとは本当に異なるスキルになる。2分間沈黙して描き続け、その後正しい設計を明かす候補者は、面接官側から見ると、推論プロセスの証拠を一切示せておらず、結果だけが見えている状態である。そして目に見える推論を伴わない結果は、幸運な当てずっぽうや暗記したテンプレートと見分けがつきにくい。これは、追加質問が未知の領域に触れたときにさらに重要になる。実際の面接ループでは、ほぼ誰もがどこかの時点でこれを経験するが、黙り込んだり、はったりで乗り切ろうとしたりする衝動は、あらゆる主張を独自に検証してくれるわけではない相手に技術的な判断を伝えることが本質的な役割において、まさに間違った選択である。本当に知らないことを正直にうまく扱うことは、暗記した内容に自信満々に答えるよりも、しばしばより上級者らしく見える。それは、まさに採用しようとしているスキル、つまり不確実性の中でその場で、声に出して、誰かの前で推論することを示しているからである。このシートは、そのスキルの両面、描きながら安定したナレーションを続けること、そして質問が本当に知らないことに触れた瞬間に何をすべきかを扱う。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> Narrating means thinking out loud while drawing and reasoning, rather than working in silence and only revealing conclusions. Handling unknowns means having a specific, honest, low-drama way to respond when a question touches something genuinely unfamiliar, rather than freezing, going silent, or bluffing.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>ナレーションとは、沈黙したまま作業して結論だけを明かすのではなく、描きながら、推論しながら、声に出して考えることである。未知への対応とは、質問が本当になじみのないことに触れたとき、固まったり、黙り込んだり、はったりをかけたりするのではなく、具体的で正直で大げさにならない対応方法を持つことである。</span></p>'
    + '<p><span class="en"><strong>Why it matters:</strong> The interviewer\'s evaluation is built almost entirely from what\'s said and drawn, so anything reasoned silently is invisible to them, and anything bluffed tends to unravel under the deep follow-up questions this loop is known for, leaving a worse impression than an honest gap ever would.</span>'
    + '<span class="jp"><strong>重要な理由：</strong>面接官の評価は、話されたことと描かれたことからほぼ完全に構築される。そのため、黙って推論したことは面接官には見えず、はったりをかけたことは、このループでよく知られている深い追加質問の中で崩れやすく、正直に知らないと認めるよりもずっと悪い印象を残してしまう。</span></p>'
    + '<div class="primer-when">'
    + '<div class="pw-yes"><div class="pw-label"><span class="en">USE IT WHEN</span><span class="jp">使うべき場合</span></div><ul>'
    + '<li><span class="en">Throughout the entire whiteboard session, and specifically the moment any question touches unfamiliar territory</span><span class="jp">ホワイトボードセッション全体を通して、特にどんな質問であれ未知の領域に触れた瞬間</span></li>'
    + '</ul></div>'
    + '<div class="pw-no"><div class="pw-label"><span class="en">PAUSE BRIEFLY WHEN</span><span class="jp">短く止まってよい場合</span></div><ul>'
    + '<li><span class="en">A hard trade-off needs genuine silent thought, a few seconds of stated "let me think through this" is fine and expected</span><span class="jp">難しいトレードオフに本当に静かな思考が必要な場合、「少し考えさせてください」と一言添えた数秒の沈黙は問題なく想定内</span></li>'
    + '</ul></div>'
    + '</div>'
    + '</div>'
    + '<div class="diagram"><div class="diagram-label"><span class="en">The honest unknown-handling script</span><span class="jp">正直な未知対応の型</span></div>'
    + '<svg viewBox="0 0 760 140" width="100%" height="auto" role="img" aria-label="Handling unknowns flow diagram">'
    + '<defs><marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4A5620"/></marker></defs>'
    + '<g font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="700">'
    + '<rect x="10" y="30" width="220" height="60" fill="#E8EDD4" stroke="#1B2430" stroke-width="3"/><text x="120" y="55" text-anchor="middle" fill="#4A5620">NAME THE GAP</text><text x="120" y="70" text-anchor="middle" fill="#4A5620">HONESTLY</text>'
    + '<rect x="270" y="30" width="220" height="60" fill="#FFFFFF" stroke="#1B2430" stroke-width="3"/><text x="380" y="55" text-anchor="middle" fill="#1B2430">REASON FROM</text><text x="380" y="70" text-anchor="middle" fill="#1B2430">WHAT IS KNOWN</text>'
    + '<rect x="530" y="30" width="220" height="60" fill="#4A5620" stroke="#1B2430" stroke-width="3"/><text x="640" y="55" text-anchor="middle" fill="#FFFFFF">OFFER TO</text><text x="640" y="70" text-anchor="middle" fill="#FFFFFF">VERIFY / LEARN</text>'
    + '</g>'
    + '<g stroke="#4A5620" stroke-width="2.5" fill="none" marker-end="url(#arrowO)">'
    + '<path d="M234,60 L264,60"/><path d="M494,60 L524,60"/>'
    + '</g></svg></div>'
    + '<div class="module" style="--accent:#7A8A3D;--accent-dark:#4A5620;--tint:#E8EDD4">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">Narrating while drawing</span><span class="jp">描きながらのナレーション</span></h3>'
    + '<p><span class="en">Narration doesn\'t mean describing every pixel drawn, it means voicing the reasoning behind each addition: why this component, why it connects here, what it\'s for. The difference between "this is the scheduler" (label) and reasoning through why it\'s needed is the entire value of narration.</span>'
    + '<span class="jp">ナレーションとは、描いたすべてのピクセルを説明することではなく、各追加の背後にある理由を声に出すことである。なぜこのコンポーネントなのか、なぜここで繋がるのか、何のためのものか。「これはスケジューラーです」（ラベル）と、なぜそれが必要かを推論することの違いこそが、ナレーションの価値そのものである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Instead of silently drawing five boxes and explaining the whole thing at once, narrate each addition as it happens: "I\'ll start with source control feeding into a dependency graph, since that\'s what tells us what actually needs rebuilding," then draw it, then continue to the next piece.</span>'
    + '<span class="jp">黙って5つの箱を描いてから一気にすべてを説明するのではなく、各追加をその場で説明する。「まずソース管理から依存関係グラフへの流れから始めます。これが実際に何を再ビルドすべきかを教えてくれるためです」、そう言ってから描き、次の要素へ進む。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Narrate the why behind each box, not just its label.</span><span class="jp">箱のラベルだけでなく、その背後にある理由を説明する。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#7A8A3D;--accent-dark:#4A5620;--tint:#E8EDD4">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">The honest "I don\'t know, here\'s how I\'d find out" script</span><span class="jp">「分かりません、こう確認します」という正直な型</span></h3>'
    + '<p><span class="en">When a follow-up touches something genuinely unfamiliar, the strongest move is a short, direct sequence: state plainly that this isn\'t an area of direct experience, then immediately pivot to how the question would actually be approached, using reasoning from adjacent things that are understood.</span>'
    + '<span class="jp">追加質問が本当になじみのないことに触れたとき、最も強い対応は短く率直な流れである。これは直接の経験がある領域ではないと率直に述べ、すぐに、理解している隣接分野からの推論を使って、実際にどうその問いにアプローチするかへと切り替える。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">If asked about a specific tool not directly used, a strong response is: "I haven\'t worked directly with that, so I don\'t want to guess at specifics I\'m not sure of. Based on the general pattern though, I\'d expect it handles [reasoned guess], and I\'d want to verify that before committing to it in a real design."</span>'
    + '<span class="jp">直接使ったことのない特定のツールについて聞かれた場合、強い回答はこうなる。「それを直接使った経験はないので、確信のない詳細を推測したくはありません。ただ、一般的なパターンから考えると、おそらく[根拠のある推測]のように扱われると思います。実際の設計に組み込む前に確認したいところです。」</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Name the gap once, then immediately show how you\'d reason around it.</span><span class="jp">ギャップを一度だけ名指しし、すぐにそれをどう推論して乗り越えるかを示す。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#7A8A3D;--accent-dark:#4A5620;--tint:#E8EDD4">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Buying thinking time without looking lost</span><span class="jp">迷子に見えずに考える時間を稼ぐ</span></h3>'
    + '<p><span class="en">A few concrete, low-cost techniques exist for genuine pauses: repeating the question back in your own words, restating the relevant assumption already established, or explicitly saying "let me think through this for a second" rather than just going silent unexplained.</span>'
    + '<span class="jp">本当に必要な間には、いくつかの具体的で低コストな技術がある。質問を自分の言葉で言い換える、すでに立てた関連する前提を再確認する、あるいは何も説明せず黙り込むのではなく「少し考えさせてください」と明示的に言う、といったものである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">"So if I\'m understanding right, you\'re asking what happens if the shared cache tier itself goes down mid-build, let me think through that for a moment" buys several seconds of visible, legitimate thinking time rather than an unexplained pause that reads as being stuck.</span>'
    + '<span class="jp">「つまり、共有キャッシュ層自体がビルドの途中でダウンした場合どうなるか、というご質問と理解していますが、少し考えさせてください」という一言は、説明のない沈黙が詰まっているように見えるのとは違い、目に見える正当な思考時間を数秒間確保してくれる。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Silence with a label ("let me think") reads as composure. Silence with no label reads as stuck.</span><span class="jp">ラベル付きの沈黙（「考えさせてください」）は落ち着きに見える。ラベルのない沈黙は詰まって見える。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#7A8A3D;--accent-dark:#4A5620;--tint:#E8EDD4">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">Reading interviewer cues</span><span class="jp">面接官のサインを読む</span></h3>'
    + '<p><span class="en">Interviewers give real-time signals worth watching for: leaning in or taking notes usually means continue in the current direction, a redirect question usually means move on from the current thread, and a long pause after an answer often means they\'re waiting for more depth, not that the answer was wrong.</span>'
    + '<span class="jp">面接官はリアルタイムで注目に値するサインを出している。身を乗り出す、あるいはメモを取ることは通常、今の方向を続けるべきサイン。方向転換の質問は通常、今のスレッドを切り上げるべきサイン。回答後の長い沈黙は、しばしば回答が間違っていたのではなく、より深い内容を待っているサインである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">If an interviewer asks a narrow follow-up right after a broad point, that\'s usually a signal they want to go deeper there specifically, not a hint that the broad point itself was unsatisfactory, matching the follow-up\'s scope rather than re-explaining the whole broad point is the right response.</span>'
    + '<span class="jp">大きな論点の直後に面接官が狭い追加質問をしてきた場合、それは通常、大きな論点自体が不十分だったというヒントではなく、その部分を特に深掘りしたいというサインである。大きな論点全体を再説明するのではなく、追加質問の範囲に合わせて答えるのが正しい対応である。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">A follow-up question is usually a request for more, not a correction of what came before.</span><span class="jp">追加質問は通常、それまでの内容の訂正ではなく、もっと聞きたいという要求である。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">What if I genuinely have no idea how to reason about the unfamiliar thing at all?</span><span class="jp">未知のものについて全く推論の糸口すら見つからない場合は？</span></summary>'
    + '<div class="fu-a"><span class="en">It\'s fine to say so plainly and pivot to a related area of genuine strength: "I don\'t have a good way to reason about that specific piece, but here\'s how I\'d think about the surrounding problem based on [related area]," total honesty paired with redirecting to real strength beats a forced guess.</span>'
    + '<span class="jp">率直にそう述べ、本当に強みのある関連分野へ切り替えれば良い。「その特定の部分について良い推論の方法は持ち合わせていませんが、[関連分野]に基づいて、その周辺の問題をこう考えます」。完全な正直さと、本当の強みへの切り替えの組み合わせは、無理な推測に勝る。</span></div></details>'
    + '<details class="followup"><summary><span class="en">Doesn\'t admitting you don\'t know something hurt the interview?</span><span class="jp">知らないと認めることは面接にとってマイナスにならないか？</span></summary>'
    + '<div class="fu-a"><span class="en">Not nearly as much as being caught bluffing under a deep follow-up does. A candidate who can\'t answer follow-ups after guessing leaves a worse impression than one who was upfront from the start.</span>'
    + '<span class="jp">深い追加質問の中ではったりが見破られることに比べれば、はるかにましである。推測した後の追加質問に答えられない候補者は、最初から率直だった候補者よりも悪い印象を残してしまう。</span></div></details>'
    + '<div class="say-out-loud"><div class="mono"><span class="en">Say this out loud</span><span class="jp">面接でそのまま口に出す一言</span></div>'
    + '<p><span class="en">"I haven\'t worked directly with that specific piece, so let me reason through it based on what I do know, and I\'d want to verify the details before committing to it in a real design."</span>'
    + '<span class="jp">「その特定の部分については直接の経験がないので、知っていることに基づいて推論させてください。実際の設計に組み込む前に、詳細を確認したいところです。」</span></p></div>'
    + '</div>';
  },
  '8-2': function(){ return ''
    + '<div style="'+styleFor('steel')+'">'
    + '<div class="sheet-tag mono">SHEET 4 / 4</div>'
    + '<div class="sheet-eyebrow"><span class="en">2.4 · Scenario Bank Overview</span><span class="jp">2.4・想定シナリオ集</span></div>'
    + '<h2 class="sec-headline"><span class="en">The same toolkit, different clothes</span><span class="jp">同じ道具箱、違う衣装</span></h2>'
    + '<p class="sec-intro"><span class="en">Everything built so far centers on one specific whiteboard prompt, a distributed build system, covered in enough depth to answer almost anything asked about it directly. But the actual interview loop won\'t necessarily hand over that exact prompt, and preparing only for one specific scenario risks looking rigid or over-rehearsed if a different one comes up instead. The reassuring part is that the underlying toolkit built through Part 1, dependency structure, caching, scheduling, fault tolerance, capacity reasoning, isn\'t actually specific to build systems at all, it\'s a general pattern that shows up again and again across game-industry system design prompts with different surface details. A global simultaneous launch, a live-ops telemetry pipeline, and a real-time matchmaking system all look completely different on the surface. But each one has its own version of the same four questions: what depends on what, what work gets repeated and could be cached, how is limited capacity shared fairly, and what happens when something fails. This sheet is deliberately lighter than Part 1. It\'s not meant to build the same depth on three more topics, it\'s meant to demonstrate that the depth already built transfers, and to give a repeatable method for approaching literally any unfamiliar prompt cold. Recognizing the same underlying shape under a new surface is, in itself, a strong signal of real understanding rather than memorization.</span>'
    + '<span class="jp">ここまで構築してきたものはすべて、分散ビルドシステムという1つの特定のホワイトボードお題を中心にしており、それについて直接尋ねられたほぼ何にでも答えられるだけの深さを備えている。しかし実際の面接ループが必ずしもその全く同じお題を出してくるとは限らず、1つの特定のシナリオだけに備えることは、別のお題が出た場合に硬直的、あるいは準備しすぎに見えるリスクを伴う。安心できるのは、Part 1を通じて構築した基盤となる道具箱、依存構造、キャッシュ、スケジューリング、耐障害性、容量の推論が、実はビルドシステムに特有のものでは全くなく、表面的な詳細が異なるだけで、ゲーム業界のシステム設計のお題に繰り返し現れる一般的なパターンだという点である。世界同時ローンチ、ライブ運用のテレメトリパイプライン、リアルタイムマッチメイキングシステムは、表面上は全く異なって見える。しかしそれぞれに、同じ4つの問い、何が何に依存しているか、どの作業が繰り返されキャッシュできるか、限られたキャパシティをどう公平に共有するか、何かが失敗したときどうなるか、の独自の版が存在する。このシートは意図的にPart 1より軽く作られている。他の3つのテーマで同じ深さを構築することが目的ではなく、すでに構築した深さが転用できることを示し、文字通りどんな未知のお題にもその場で取り組める再現可能な方法を提供することが目的である。新しい表面の下に同じ基本構造を認識できること自体が、暗記ではなく本当の理解の強いシグナルである。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> The scenario bank is a set of other common game-industry system-design prompts, sketched at a fundamentals level, alongside a general method for mapping the same core toolkit onto any new prompt encountered cold.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>シナリオ集とは、他によくあるゲーム業界のシステム設計のお題を基礎レベルでスケッチしたものであり、同じ中核となる道具箱を、その場で出会う新しいどんなお題にも当てはめるための一般的な方法を併せて示すものである。</span></p>'
    + '<p><span class="en"><strong>Why it matters:</strong> Interview loops are unpredictable by design, and an answer built entirely around one memorized scenario can fall apart the moment the surface details change, even if the underlying reasoning would have transferred perfectly well.</span>'

    + '<div class="module" style="--accent:#5B7A94;--accent-dark:#33495C;--tint:#DDE6EC">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">Global simultaneous launch</span><span class="jp">世界同時ローンチ</span></h3>'
    + '<p><span class="en">The core challenge is coordinating a release across many regions and platforms at once, without any region\'s infrastructure becoming a bottleneck for the others, and with the ability to react to load in real time. The "dependency" here isn\'t file dependencies, it\'s release-readiness dependencies: nothing goes live in any region until every required component is confirmed ready everywhere.</span>'
    + '<span class="jp">中核となる課題は、どの地域のインフラも他の地域のボトルネックにならないようにしながら、多数の地域・プラットフォームにまたがるリリースを同時に調整し、負荷にリアルタイムで対応できることである。ここでの「依存関係」はファイルの依存関係ではなく、リリース準備の依存関係である。必要なすべての要素がどこでも準備完了と確認されるまで、どの地域でも公開されない。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Applying the toolkit</span><span class="jp">道具箱の応用</span></div>'
    + '<p><span class="en">The graph fundamental becomes a release-readiness checklist per region/platform; caching becomes pre-positioning build artifacts close to each region ahead of time rather than transferring them at launch moment; scheduling becomes staggering or coordinating go-live timing; fault tolerance becomes a rollback plan per region that doesn\'t affect regions that launched cleanly.</span>'
    + '<span class="jp">グラフの基本要素は地域・プラットフォームごとのリリース準備チェックリストになる。キャッシュは、ローンチの瞬間に転送するのではなく、事前に各地域の近くにビルド成果物を配置しておくことになる。スケジューリングは、公開タイミングの分散や調整になる。耐障害性は、正常にローンチできた地域に影響しない、地域ごとのロールバック計画になる。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Same graph-cache-schedule-recover shape, applied to regions and readiness instead of files and workers.</span><span class="jp">同じグラフ・キャッシュ・スケジュール・復旧の形を、ファイルとワーカーではなく、地域と準備状況に適用する。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#5B7A94;--accent-dark:#33495C;--tint:#DDE6EC">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Live-ops telemetry and analytics pipeline</span><span class="jp">ライブ運用のテレメトリ・分析パイプライン</span></h3>'
    + '<p><span class="en">The core challenge is ingesting a continuous, high-volume stream of gameplay events from millions of concurrent players and turning it into something usable, dashboards, alerts, matchmaking signals, without falling behind the incoming data or losing events during failures.</span>'
    + '<span class="jp">中核となる課題は、何百万人もの同時プレイヤーからの継続的で大量なゲームプレイイベントのストリームを取り込み、それをダッシュボード・アラート・マッチメイキング用シグナルなど使えるものに変換することであり、入ってくるデータに遅れを取らず、障害中にイベントを失わないことである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Applying the toolkit</span><span class="jp">道具箱の応用</span></div>'
    + '<p><span class="en">Dependency structure becomes the processing pipeline stages (raw events → cleaned/validated → aggregated → queryable); caching becomes pre-aggregating common queries; scheduling becomes prioritizing latency-sensitive signals over less time-sensitive ones; fault tolerance becomes ensuring no player events get silently dropped during a processing failure, often via a durable retrying queue.</span>'
    + '<span class="jp">依存構造は処理パイプラインの段階（生イベント→クレンジング・検証済み→集計済み→クエリ可能）になる。キャッシュは、よくあるクエリの事前集計になる。スケジューリングは、時間的制約の緩いシグナルよりレイテンシに敏感なシグナルを優先することになる。耐障害性は、処理障害中にプレイヤーイベントが静かに失われないことになり、多くの場合、再試行可能な永続キューによって実現される。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Same shape, applied to a continuous stream of events instead of a batch of build jobs.</span><span class="jp">同じ形を、ビルドジョブのバッチではなく、連続的なイベントのストリームに適用する。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#5B7A94;--accent-dark:#33495C;--tint:#DDE6EC">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Real-time matchmaking</span><span class="jp">リアルタイムマッチメイキング</span></h3>'
    + '<p><span class="en">The core challenge is grouping players into fair, low-latency matches from a constantly changing pool of waiting players, balancing match quality against wait time, since waiting too long for a "perfect" match is often worse than an imperfect match delivered quickly.</span>'
    + '<span class="jp">中核となる課題は、絶えず変化する待機プレイヤーのプールから、公平で低レイテンシなマッチにプレイヤーをグループ分けし、マッチの質と待ち時間のバランスを取ることである。「完璧な」マッチを長く待つことは、迅速に提供される不完全なマッチよりも悪いことが多いためである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Applying the toolkit</span><span class="jp">道具箱の応用</span></div>'
    + '<p><span class="en">Scheduling and fair-share is almost the entire problem here. Deciding which waiting players get matched together, and in what order, is a direct cousin of build-job scheduling. Capacity math reappears directly too, since matchmaking has the exact same arrival-rate-vs-service-rate queueing logic as the build farm. Fault tolerance becomes handling a player disconnecting mid-match-formation without breaking the match for everyone else.</span>'
    + '<span class="jp">スケジューリングと公平配分がほぼ問題の全体を占める。どの待機プレイヤーをどの順序で組み合わせるかを決めることは、ビルドジョブのスケジューリングの直系のいとこである。容量計算もそのまま再登場する。マッチメイキングはビルドファームと全く同じ到着率対処理率のキューイング論理を持つためである。耐障害性は、他の全員のマッチを壊すことなく、マッチ形成の途中でプレイヤーが切断した場合の対処になる。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">The build farm\'s scheduler and the matchmaker\'s scheduler are solving structurally the same problem with different objects.</span><span class="jp">ビルドファームのスケジューラーとマッチメイカーのスケジューラーは、構造的に同じ問題を、異なる対象で解いている。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#5B7A94;--accent-dark:#33495C;--tint:#DDE6EC">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">The transfer method for any new, unfamiliar prompt</span><span class="jp">未知の新しいお題への転用方法</span></h3>'
    + '<p><span class="en">When an entirely new prompt lands cold, a repeatable move is to ask the same five questions regardless of domain. What depends on what, that\'s the graph question. What work is likely to repeat and could be reused, that\'s the caching question. How is limited capacity shared fairly, that\'s the scheduling question. What fails and how does it recover gracefully, that\'s the fault-tolerance question. And what\'s genuinely unique about this domain that a generic answer would miss, that\'s the domain-specific question.</span>'
    + '<span class="jp">全く新しいお題がその場で出されたとき、再現可能な動きは、領域に関わらず同じ5つの質問をすることである。何が何に依存しているか、これがグラフの問いである。どの作業が繰り返され再利用できそうか、これがキャッシュの問いである。限られたキャパシティをどう公平に共有するか、これがスケジューリングの問いである。何が失敗し、どう優雅に復旧するか、これが耐障害性の問いである。そして、汎用的な答えでは見落としてしまう、この領域に本当に特有なものは何か、これが領域特有の問いである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Even a completely unfamiliar prompt like "design a friend-list and social graph system" can be approached this way. What depends on what: a friendship needs consistency on both sides. What\'s cacheable: a friend list is read far more often than it\'s written. How is capacity shared: by protecting against one user spamming requests. What fails: a partial write, if one side of a friendship link succeeds and the other doesn\'t.</span>'
    + '<span class="jp">「フレンドリストとソーシャルグラフのシステムを設計してください」のような全く未知のお題でさえ、この方法でアプローチできる。何が何に依存しているか（友人関係は双方の一貫性を必要とする）、何がキャッシュ可能か（フレンドリストは書き込みよりはるかに多く読み取られる）、キャパシティはどう共有されるか（1人のユーザーがリクエストを乱発するのを防ぐ）、何が失敗するか（リンクの片側は成功し片側は失敗した場合の部分的な書き込み）。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Five questions, asked in the same order, turn any unfamiliar prompt into a structured starting point: graph, cache, schedule, recover, domain-specific twist.</span><span class="jp">同じ順序で問う5つの質問が、どんな未知のお題も構造化された出発点に変える。グラフ、キャッシュ、スケジュール、復旧、領域特有のひねり。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">What if the new prompt is in a domain I genuinely know nothing about, like payments or authentication?</span><span class="jp">決済や認証のような、本当に何も知らない領域のお題だったら？</span></summary>'
    + '<div class="fu-a"><span class="en">The five-question method still applies, the "domain-specific twist" question is exactly the placeholder for whatever is unfamiliar, and it\'s fine to flag that specific piece as an honest unknown while still applying the general structure confidently to the rest.</span>'
    + '<span class="jp">5つの質問の方法はそれでも適用できる。「領域特有のひねり」の問いは、まさになじみのないものそのもののための枠である。その特定の部分は正直に未知として明示しつつ、残りには汎用的な構造を自信を持って適用すればよい。</span></div></details>'
    + '<details class="followup"><summary><span class="en">How much should I actually prepare on scenarios I\'m not sure will come up?</span><span class="jp">出るかどうか分からないシナリオに、実際どれだけ備えるべきか？</span></summary>'
    + '<div class="fu-a"><span class="en">Depth on the flagship matters more than breadth across many scenarios, this sheet is meant to prove the toolkit transfers, not to become nine more sheets deep on every possible prompt, a light pass here is enough.</span>'
    + '<span class="jp">多くのシナリオにわたる幅広さよりも、旗艦テーマの深さの方が重要である。このシートは道具箱が転用できることを証明するためのものであり、あらゆるお題についてさらに9枚分の深さを構築するためのものではない。ここでは軽く目を通す程度で十分である。</span></div></details>'
    + '<div class="say-out-loud"><div class="mono"><span class="en">Say this out loud</span><span class="jp">面接でそのまま口に出す一言</span></div>'
    + '<p><span class="en">"This isn\'t a domain I\'ve built a system for directly, but let me apply the same approach I\'d use for any distributed system: what depends on what, what can be cached, how is capacity shared fairly, and what happens when something fails."</span>'
    + '<span class="jp">「これは直接システムを構築したことのある領域ではありませんが、どんな分散システムにも使う同じアプローチを適用させてください。何が何に依存しているか、何をキャッシュできるか、キャパシティをどう公平に共有するか、そして何かが失敗したときどうなるか、という点です。」</span></p></div>'
    + '</div>';
  },
  'I-1': function(){ return ''
    + '<div style="'+styleFor('cyan')+'">'
    + '<div class="sheet-tag mono">SHEET 1 / 8</div>'
    + '<div class="sheet-eyebrow"><span class="en">3.1 · Client–Server, APIs &amp; Statelessness</span><span class="jp">3.1・クライアント・サーバーとAPI</span></div>'
    + '<h2 class="sec-headline"><span class="en">Two roles, one contract, no memory</span><span class="jp">2つの役割、1つの契約、そして記憶を持たないこと</span></h2>'
    + '<p class="sec-intro"><span class="en">Nearly every piece of modern software, from a mobile game to a global cloud platform, is built out of the same basic relationship repeated over and over: something asking for information or action, and something else providing it. Understanding that one relationship precisely, who is asking, what they\'re allowed to ask for, and whether the answerer remembers anything about them afterward, turns out to explain far more of how large systems actually work than it first appears to. This isn\'t a AWS-specific idea or even a cloud-specific one, it predates the cloud entirely and shows up identically whether the "server" is a single laptop or a fleet of a thousand machines. What changes at scale isn\'t the relationship itself, it\'s whether that relationship was built in a way that lets many interchangeable servers share the load, which depends entirely on one property: statelessness. Getting this sheet solid pays off immediately, because it\'s the lens nearly every later fundamental in this Part gets viewed through. This sheet covers the client-server relationship itself, what an API actually is as a concept, and why statelessness specifically is what makes horizontal scaling possible at all.</span>'
    + '<span class="jp">モバイルゲームからグローバルなクラウドプラットフォームまで、現代のソフトウェアのほとんどすべては、同じ基本的な関係が何度も繰り返されることで成り立っている。何かが情報や動作を求め、別の何かがそれを提供する、という関係である。誰が求めているのか、何を求めることが許されているのか、そして答える側がその後何かを覚えているのか、という点まで正確にこの1つの関係を理解することは、最初に見えるよりもはるかに多く、大規模なシステムが実際にどう機能するかを説明してくれる。これはAWS特有の考え方でも、クラウド特有の考え方でもない。クラウドが登場するよりずっと前から存在しており、「サーバー」が1台のノートパソコンであっても、1000台のマシンの集団であっても全く同じ形で現れる。規模が変わっても関係そのものは変わらない。変わるのは、その関係が、多数の互換性あるサーバーで負荷を分担できるように構築されているかどうかであり、それは完全に1つの性質、状態を持たないこと（ステートレス性）にかかっている。このシートをしっかり押さえておくことはすぐに効いてくる。このPartのほとんどの後続の基本要素を見る際のレンズになるからである。このシートでは、クライアント・サーバーの関係そのもの、APIが概念として実際には何であるか、そしてなぜステートレス性が水平スケーリングを可能にするのかを扱う。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> A client is the thing asking for something, an app, a browser, a game running on a console. A server is the thing that has what\'s being asked for and sends back an answer. An API is the agreed-upon way the client is allowed to ask, a fixed menu of requests the server promises to understand, rather than the client reaching in and touching the server\'s internals directly.</span>'

    + '<h3><span class="en">Statelessness is what makes horizontal scaling possible</span><span class="jp">ステートレス性が水平スケーリングを可能にする</span></h3>'
    + '<p><span class="en">A stateless server doesn\'t remember anything about a specific client between one request and the next, each request carries everything needed to be understood on its own. This means ANY available server can handle ANY incoming request, since no server has to be "the one that remembers" a particular client\'s session, which is exactly what allows a farm of many interchangeable servers to share load freely.</span>'

  'I-2': function(){ return ''

    + '<p class="sec-intro"><span class="en">A natural default when designing a system is to make everything happen in a straight, predictable line: ask, wait, get the answer, move to the next step, and this default is fine right up until one slow step in that line ends up blocking everything behind it. A checkout process that has to wait for an email confirmation to fully send before letting the user see "order complete" is paying for a delay it never actually needed to pay for, the email sending and the user seeing confirmation don\'t have any real reason to be tied together. Recognizing which parts of a system genuinely need an immediate answer, and which parts are just defaulting to synchronous out of habit, is one of the more valuable, transferable judgment calls a candidate can demonstrate. This distinction also connects directly to why large systems get split into multiple separate services in the first place, rather than staying as one giant program, since decoupled pieces are what actually makes asynchronous processing possible at a system-wide level. None of this is exotic or AWS-specific, it\'s a pattern that shows up in every sufficiently large system regardless of what it\'s built on. This sheet covers the sync-vs-async distinction, what a queue actually does mechanically, why systems get split into services, and the real cost that decoupling isn\'t free.</span>'
    + '<span class="jp">システムを設計する際の自然なデフォルトは、すべてを一直線の予測可能な流れにすることである。尋ねて、待って、答えを受け取り、次のステップに進む。このデフォルトは、その流れの中の1つの遅いステップが、その後ろにあるすべてをブロックしてしまうまでは問題にならない。確認メールの送信が完全に終わるまで待ってから「注文完了」をユーザーに見せるチェックアウト処理は、本来支払う必要のなかった遅延の代償を払っている。メール送信とユーザーへの確認表示が結びついている本当の理由はないのである。システムのどの部分が本当に即座の答えを必要とし、どの部分が単に習慣で同期的になっているだけなのかを見抜くことは、候補者が示せる、より価値があり応用の効く判断力の1つである。この区別はまた、なぜ大規模なシステムがそもそも1つの巨大なプログラムのままでいるのではなく、複数の別々のサービスに分割されるのかということにも直接つながる。分離された部品があってはじめて、システム全体レベルでの非同期処理が可能になるからである。これはどれも特殊なものでも、AWS特有のものでもなく、何に基づいて構築されていようと、十分大規模なあらゆるシステムに現れるパターンである。このシートでは、同期と非同期の区別、キューが仕組みとして実際に何をしているか、なぜシステムがサービスに分割されるのか、そして分離が無料ではないという本当のコストを扱う。</span></p>'

    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">Sync vs async, the waiting room analogy</span><span class="jp">同期と非同期、待合室のたとえ</span></h3>'
    + '<p><span class="en">Synchronous is like ordering at a fast-food counter and waiting right there until your food is ready, you can\'t leave and come back. Asynchronous is like ordering at a sit-down restaurant, getting a buzzer, and going to sit down, free to do other things until the buzzer goes off telling you it\'s ready.</span>'

    + '<p><span class="en">A queue sits between whoever creates work (the producer) and whoever does the work (the consumer), so the producer can drop off a task and immediately move on, without needing the consumer to be available right that second, or even needing to know how many consumers exist or how fast they are.</span>'
    + '<span class="jp">キューは、作業を生み出す側（プロデューサー）と作業を行う側（コンシューマー）の間に位置する。これにより、プロデューサーはタスクを置いてすぐに先に進むことができ、コンシューマーがその瞬間に空いている必要も、コンシューマーが何人存在しどれだけ速いかを知る必要もない。</span></p>'

    + '<p><span class="en">Recall the build farm\'s job queue (1.5), a programmer submitting a changelist doesn\'t wait for a specific worker to become free, they submit into a queue and move on, and whichever worker becomes available next picks up the job, the exact same producer-queue-consumer pattern.</span>'

    + '<h3><span class="en">Why systems get split into separate services</span><span class="jp">なぜシステムは別々のサービスに分割されるのか</span></h3>'
    + '<p><span class="en">As a system grows, cramming everything into one giant program becomes fragile, one bug in an unrelated feature can crash everything, and it becomes hard for different teams to work on different parts without stepping on each other. Splitting into separate services, each with a clear responsibility and communicating over defined APIs, is how large systems stay manageable, at the cost of needing to think carefully about how those services talk to each other.</span>'
    + '<span class="jp">システムが成長すると、すべてを1つの巨大なプログラムに詰め込むことは脆くなる。無関係な機能の1つのバグがすべてをクラッシュさせかねず、異なるチームが互いに邪魔し合わずに別々の部分を担当することが難しくなる。それぞれが明確な責任を持ち、定義されたAPIを通じて通信する別々のサービスに分割することが、大規模なシステムを管理可能に保つ方法である。ただしその代償として、それらのサービスがどう会話するかを注意深く考える必要がある。</span></p>'

    + '<h3><span class="en">The real trade-off: decoupling costs something too</span><span class="jp">本当のトレードオフ：分離にも代償がある</span></h3>'
    + '<p><span class="en">Async processing and service splitting both trade immediate simplicity for long-term resilience and scalability, but they add real complexity: it\'s harder to trace what happened when something goes wrong across multiple services and a queue, compared to one program doing everything in a straight line. This trade-off should be named explicitly, not assumed to be free.</span>'
    + '<span class="jp">非同期処理とサービス分割はどちらも、当面のシンプルさを、長期的な回復力とスケーラビリティと引き換えにしている。しかしこれらは実際の複雑さを増す。すべてを一直線で行う1つのプログラムに比べ、複数のサービスとキューにまたがって何が起きたかを追跡することは難しくなる。このトレードオフは、無料だと思い込むのではなく、明示的に言及すべきである。</span></p>'

    + '<details class="followup"><summary><span class="en">How do you know if a task is safe to make asynchronous?</span><span class="jp">あるタスクを非同期にしても安全かどうか、どう判断するか？</span></summary>'

    + '<p><span class="en">At one end, a virtual machine gives full control over the operating system and everything on it, at the cost of managing all of it yourself. In the middle, containers package just an application and what it needs, sharing the underlying operating system, lighter and faster to start than a full VM. At the far end, serverless functions run your code only when triggered, for exactly as long as needed, with no server to manage at all, at the cost of less control and limits on how long a single execution can run.</span>'

    + '<span><span class="en">VM: you own the whole kitchen. Container: you rent a food truck. Serverless: you pay a chef only for the exact minutes they\'re cooking your order.</span><span class="jp">VM：キッチン全体を所有する。コンテナ：フードトラックを借りる。サーバーレス：シェフがあなたの注文を調理しているまさにその時間分だけ支払う。</span></span></div>'

    + '<h3><span class="en">Three shapes of storage: block, object, and file</span><span class="jp">3つのストレージの形：ブロック、オブジェクト、ファイル</span></h3>'
    + '<p><span class="en">Block storage is like a raw hard drive attached to one specific machine, fast, but tied to that machine. Object storage holds whole files as complete objects with a unique address, reachable from anywhere over the network, not tied to any one machine, but not something you can partially edit in place. File storage sits in between, a shared folder structure multiple machines can mount and browse together.</span>'

    + '<span class="jp">（1.4の）L1キャッシュを保持するビルドワーカーのローカルディスクはブロックストレージであり、高速でその1台のマシンにローカルである。ファーム内のすべてのワーカーからアクセス可能な共有L2キャッシュクラスターはオブジェクトストレージであり、コンテンツハッシュでアドレス指定され、どこからでも到達でき、単一のマシンに紐づかない。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'

    + '<p><span class="en">The right choice isn\'t about which option sounds most modern, it\'s about matching the shape to the job\'s actual pattern: how often does this run, how long does it need to persist, does it need to be reachable from many machines or just one. Picking serverless for something that needs to run continuously for hours, or block storage for something fifty machines need to reach at once, are both mismatches that create real problems later.</span>'

    + '<span class="jp">（1.4の）ビルドファームの多層キャッシュを思い出してほしい。各層は理由があって意図的に異なるストレージの形を使っている。最速の単一マシン層にはローカルなブロックストレージ、すべてのワーカーから到達できる必要がある層には共有のオブジェクトストレージであり、これはストレージの形をアクセスパターンに合わせることから直接導かれている。</span></p></div>'

    + '<details class="followup"><summary><span class="en">How do you decide between container and serverless specifically?</span><span class="jp">コンテナとサーバーレスを具体的にどう決めるか？</span></summary>'

    + '<details class="followup"><summary><span class="en">Why would anyone still choose a VM today given containers and serverless exist?</span><span class="jp">コンテナとサーバーレスが存在する今、なぜ今でもVMを選ぶ人がいるのか？</span></summary>'

  'II-1': function(){ return ''
    + '<div style="'+styleFor('magenta')+'">'
    + '<div class="sheet-tag mono">SHEET 4 / 8</div>'

    + '<h2 class="sec-headline"><span class="en">The default that earns its keep</span><span class="jp">その価値に見合う、デフォルトの選択</span></h2>'
    + '<p class="sec-intro"><span class="en">Despite decades of newer alternatives being introduced, the relational database remains the default choice for an enormous amount of real-world data, and that\'s not inertia, it\'s because the specific guarantees it makes turn out to matter enormously for anything involving money, inventory, or any other situation where "this must never quietly become wrong" outweighs raw speed. Those guarantees have a name, ACID, and it\'s genuinely worth understanding what each of the four letters actually promises rather than treating it as a single buzzword, since interview follow-ups tend to probe exactly this kind of precision. Indexing is the other half of this sheet, and it\'s often explained as a magic performance switch without ever explaining the actual mechanism underneath, which leaves a gap the moment a follow-up asks "why" rather than "what." This sheet works through both halves concretely: what tables and relationships actually look like, what ACID genuinely guarantees using a real transaction as the example, how an index mechanically speeds up a lookup, and the real cost side of both that\'s easy to gloss over. None of this requires knowing a specific database product\'s name, the concepts underneath are what actually transfer to a follow-up question, regardless of which product ends up being named in the room.</span>'

    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> A relational database organizes data into tables, rows and columns, like a well-structured spreadsheet, with defined relationships between tables so related data doesn\'t need to be duplicated everywhere. ACID is a set of four guarantees about how safely and reliably changes to that data are handled. An index is a separate structure that makes looking up specific rows fast, instead of checking every row one by one.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>リレーショナルデータベースは、データを行と列からなるテーブルに整理する。よく構造化されたスプレッドシートのようなもので、テーブル間に定義された関係を持ち、関連するデータをあちこちに重複させる必要がない。ACIDとは、そのデータへの変更がどれだけ安全かつ確実に処理されるかについての、4つの保証の集まりである。インデックスは、すべての行を1つずつ確認する代わりに、特定の行の検索を高速にする、別の構造である。</span></p>'
    + '<p><span class="en"><strong>Why it matters:</strong> Relational databases and their ACID guarantees are still the default choice for a huge amount of real-world data, especially anything involving money or inventory. Understanding what ACID actually promises, and what breaks without it, is foundational to reasoning about any data-storage decision.</span>'

    + '<p><span class="en">A table is a single spreadsheet, rows are individual records, columns are the fields each record has. A relationship is a table\'s row referring to a row in another table, rather than copying that other table\'s data inline.</span>'

    + '<h3><span class="en">ACID, what it actually promises</span><span class="jp">ACIDが実際に約束していること</span></h3>'
    + '<p><span class="en">Atomicity means a multi-step change either completes entirely or not at all, never half-done. Consistency means the database always moves from one valid state to another, never something contradictory. Isolation means simultaneous changes by different people don\'t corrupt each other\'s work. Durability means once a change is confirmed, it survives even a crash immediately afterward.</span>'
    + '<span class="jp">原子性とは、複数ステップの変更が完全に完了するか全く行われないかのどちらかであり、中途半端な状態にはならないことを意味する。一貫性とは、データベースが常にある有効な状態から別の有効な状態へ移行し、矛盾した状態にはならないことを意味する。分離性とは、異なる人による同時の変更が互いの作業を破壊しないことを意味する。永続性とは、変更が確定した後は、直後にクラッシュが起きても生き残ることを意味する。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Transferring money between two accounts is the classic case: subtracting from account A and adding to account B needs to happen as one atomic unit. If the system crashes after subtracting but before adding, atomicity is what guarantees the whole transaction rolls back rather than leaving money that simply vanished.</span>'
    + '<span class="jp">2つの口座間でお金を送金することは典型的な例である。口座Aから引き落とし、口座Bに加算することは、1つの原子的な単位として起こる必要がある。引き落とし後、加算前にシステムがクラッシュした場合、原子性が、お金が単に消えてしまうのではなく、トランザクション全体がロールバックされることを保証する。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">ACID is the set of promises that make "the money didn\'t just disappear" actually true, even when things go wrong mid-operation.</span><span class="jp">ACIDとは、操作の途中で何かがうまくいかなくても、「お金が消えたりしていない」ことを実際に真実にする、一連の約束である。</span></span></div>'

    + '<div class="module" style="--accent:#A83E9E;--accent-dark:#6B2568;--tint:#F2DCEF">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">What an index actually does</span><span class="jp">インデックスが実際に何をするのか</span></h3>'
    + '<p><span class="en">Without an index, finding a specific row means checking every single row in the table, one at a time, which gets slow fast as a table grows. An index is a separate, pre-sorted structure, similar to a book\'s index, that lets the database jump directly to matching rows instead of scanning everything.</span>'

    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'

  'II-2': function(){ return ''

    + '<p><span class="en">Document databases store flexible, nested records without a fixed column structure. Key-value databases are the simplest, an address paired with a value, extremely fast for simple lookups. Graph databases are built specifically around relationships themselves being first-class, useful when the connections between things matter as much as the things themselves.</span>'

    + '<span class="jp">プレイヤーのインベントリ（アイテムタイプごとに異なる属性を持つ、柔軟で変化するアイテムのリスト）は自然にドキュメントモデルに合う。一方、単純なセッショントークンの検索はキーバリューモデルに合い、友達の友達を推薦する機能はグラフモデルに合う。3つの異なる本物のニーズに対する3つの異なる形である。</span></p></div>'

    + '<p><span class="en">Keeping the same data copied across multiple machines serves two purposes at once: if one machine fails, the data still exists elsewhere (safety), and readers close to any of the copies get faster access instead of everyone hitting one distant machine (speed). But every copy has to somehow be kept in sync, which is where the real complexity begins.</span>'
    + '<span class="jp">同じデータを複数のマシンにコピーして保持することは、同時に2つの目的を果たす。1台のマシンが故障してもデータは他の場所に存在し続ける（安全性）、そしていずれかのコピーの近くにいる読み取り側は、全員が1台の遠いマシンにアクセスするのではなく、より速いアクセスを得られる（速度）。しかし、すべてのコピーは何らかの形で同期を保つ必要があり、そこから本当の複雑さが始まる。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A live-service game with players in Japan, the US, and Europe might keep a copy of frequently-read data, like item catalog info, in each region, so players read from a nearby copy instead of round-tripping to a single far-away server every time.</span>'
    + '<span class="jp">日本、米国、ヨーロッパにプレイヤーがいるライブサービスゲームは、アイテムカタログ情報のような頻繁に読み取られるデータのコピーを各地域に保持するかもしれない。プレイヤーは毎回1台の遠いサーバーに往復する代わりに、近くのコピーから読み取れる。</span></p></div>'

    + '<h3><span class="en">CAP theorem, made concrete instead of abstract</span><span class="jp">CAP定理を抽象的にではなく具体的にする</span></h3>'
    + '<p><span class="en">When a network problem splits a replicated system so its copies temporarily can\'t talk to each other, a live decision has to be made: keep serving requests on both sides even though they might disagree once reconnected (favoring Availability), or refuse to serve some requests until the copies can be confirmed in agreement again (favoring Consistency). You cannot have perfect versions of both at once during that specific failure, that\'s the actual, narrow claim CAP theorem makes.</span>'
    + '<span class="jp">ネットワークの問題が複製システムを分断し、そのコピーが一時的に互いに会話できなくなると、その場で判断を下す必要がある。再接続後に食い違うかもしれなくても両側でリクエストを処理し続けるか（可用性を優先）、コピーが再び一致していると確認できるまで一部のリクエストへの対応を拒否するか（一貫性を優先）である。その特定の障害の間、両方の完璧なバージョンを同時に持つことはできない。これがCAP定理が実際に主張している、狭く限定された内容である。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'

    + '<span class="jp">オンラインショッピングカートは可用性を選ぶかもしれない。2つのデータセンターが一時的に食い違っても、誰かがアイテムを追加し続けられるようにする。一時的に間違ったカートはささいな不便に過ぎないためである。一方、銀行の残高確認は一貫性を選ぶかもしれない。古く、間違っているかもしれない数字を表示するリスクを冒すより、残高を全く表示しない方を選ぶ。</span></p></div>'

    + '<span><span class="en">CAP isn\'t a permanent choice a system makes once, it\'s the specific decision forced onto you the moment your copies can\'t currently talk to each other.</span><span class="jp">CAPはシステムが一度だけ下す永続的な選択ではなく、コピー同士が今まさに会話できなくなった瞬間に強制される、特定の判断である。</span></span></div>'

  'III-2': function(){ return ''
    + '<div style="'+styleFor('terracotta')+'">'
    + '<div class="sheet-tag mono">SHEET 7 / 8</div>'
    + '<div class="sheet-eyebrow"><span class="en">3.7 · Scaling, Fault Tolerance &amp; Consistency</span><span class="jp">3.7・スケーリングと整合性</span></div>'
    + '<h2 class="sec-headline"><span class="en">The pattern the whole handbook keeps repeating</span><span class="jp">このハンドブック全体で繰り返されるパターン</span></h2>'
    + '<p class="sec-intro"><span class="en">By this point in the fundamentals sequence, a genuine pattern should already feel familiar: growing a system, keeping it running through failures, and keeping its data trustworthy all trace back to the same underlying tension between spreading work across many machines and coordinating those machines correctly. This sheet is deliberately the general-purpose version of something already covered in specific, concrete form, fault tolerance in the build-farm flagship\'s 1.7, determinism and consistency in 1.6, so most of the actual reasoning here is less about learning something brand new and more about recognizing it\'s the same shape wearing different clothes, the exact skill the scenario-transfer sheet (2.4) argued matters most. Scaling specifically comes in two genuinely different shapes with a real trade-off between them, and fault tolerance techniques like redundancy and failover are the general form of speculative re-execution already covered for build jobs specifically, applied here to entire servers or data centers. Consistency, the third leg, revisits the CAP theorem trade-off from 3.5 but frames it as an ongoing design choice rather than only a crisis-moment decision. Recognizing this sheet as the connective tissue tying the whole handbook together, rather than nine more new facts to memorize, is itself a strong signal of real understanding.</span>'
    + '<span class="jp">基礎知識の流れのこの段階まで来ると、本物のパターンがすでに馴染み深く感じられるはずである。システムを成長させること、障害の中でも動かし続けること、そしてそのデータを信頼できるものに保つことは、すべて、多数のマシンに作業を分散させることと、それらのマシンを正しく調整することの間にある同じ根底の緊張関係に行き着く。このシートは、意図的に、すでに具体的で個別の形で扱われたものの汎用版になっている。ビルドファームの旗艦テーマの1.7における耐障害性、1.6における決定性と整合性である。そのため、ここでの実際の推論のほとんどは、全く新しいことを学ぶというよりも、それが違う衣装をまとった同じ形であることを認識することである。まさにシナリオ転用のシート（2.4）が最も重要だと主張したスキルそのものである。スケーリングは具体的に、その間に本物のトレードオフを持つ、本質的に異なる2つの形として現れる。冗長性やフェイルオーバーといった耐障害性の技術は、すでにビルドジョブに特化して扱った投機的再実行の汎用形であり、ここではサーバーやデータセンター全体に適用される。3本目の脚である整合性は、3.5のCAP定理のトレードオフに立ち返るが、危機の瞬間だけの判断ではなく、継続的な設計上の選択として枠付けする。このシートを、9つのさらなる新しい事実としてではなく、ハンドブック全体をつなぎ合わせる結合組織として認識すること自体が、本当の理解の強いシグナルである。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> Scaling means growing a system\'s capacity. Vertical scaling means making one machine bigger. Horizontal scaling means adding more machines and spreading the work. Fault tolerance means the system keeps working, in some form, even when a piece fails. Consistency means how quickly and reliably all parts of a system agree on the current correct state.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>スケーリングとは、システムのキャパシティを成長させることである。垂直スケーリングとは、1台のマシンをより大きくすることである。水平スケーリングとは、より多くのマシンを追加し作業を分散させることである。耐障害性とは、1つの部分が故障しても、何らかの形でシステムが動き続けることである。整合性とは、システムのすべての部分が現在の正しい状態にどれだけ速く確実に合意するかである。</span></p>'

    + '<li><span class="en">The specific techniques used vary a lot by how critical availability and consistency actually are for a given system</span><span class="jp">具体的な手法は、可用性と整合性がそのシステムにとって実際にどれだけ重要かによって大きく異なる</span></li>'

    + '</div>'

    + '<g font-family="IBM Plex Mono, monospace" font-size="10" font-weight="700">'
    + '<rect x="20" y="20" width="90" height="40" fill="#F2DED4" stroke="#1B2430" stroke-width="2.5"/><text x="65" y="45" text-anchor="middle" fill="#7A3624" font-size="9">1 BIG</text>'
    + '<text x="65" y="80" text-anchor="middle" fill="#7A3624" font-size="9">VERTICAL</text>'
    + '<rect x="230" y="20" width="60" height="40" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/><rect x="300" y="20" width="60" height="40" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/><rect x="370" y="20" width="60" height="40" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>'

    + '</svg></div>'
    + '<div class="module" style="--accent:#B85C3E;--accent-dark:#7A3624;--tint:#F2DED4">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">Vertical vs horizontal scaling</span><span class="jp">垂直スケーリングと水平スケーリング</span></h3>'
    + '<p><span class="en">Vertical scaling is simple, nothing about the system\'s design has to change, but it has a hard ceiling and creates a single point of failure. Horizontal scaling has no real ceiling and improves fault tolerance, but requires the system to actually be designed to spread work across many machines, which isn\'t automatic.</span>'
    + '<span class="jp">垂直スケーリングはシンプルであり、システムの設計を何も変える必要がないが、明確な上限があり、単一障害点を生む。水平スケーリングには実質的な上限がなく耐障害性を高めるが、システムが実際に多数のマシンに作業を分散させるように設計されている必要があり、それは自動的には起こらない。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Recall the build farm itself, adding a 51st worker (horizontal) scales differently than buying one enormously powerful machine to replace all 50 (vertical); the farm\'s whole design only works because it was built around horizontal scaling from the start.</span>'
    + '<span class="jp">ビルドファーム自体を思い出してほしい。51台目のワーカーを追加すること（水平）は、50台すべてを置き換える1台の非常に強力なマシンを購入すること（垂直）とは異なる形でスケールする。ファーム全体の設計は、最初から水平スケーリングを中心に構築されていたからこそ機能する。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Vertical scaling is a bigger truck. Horizontal scaling is more trucks. More trucks don\'t help if only one truck knows the route.</span><span class="jp">垂直スケーリングはより大きなトラックである。水平スケーリングはより多くのトラックである。1台のトラックしかルートを知らないなら、トラックを増やしても意味がない。</span></span></div>'

    + '<div class="module" style="--accent:#B85C3E;--accent-dark:#7A3624;--tint:#F2DED4">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Redundancy and failover</span><span class="jp">冗長性とフェイルオーバー</span></h3>'
    + '<p><span class="en">Redundancy means having more than one of something critical, so a single failure doesn\'t take down the whole system. Failover is the mechanism that actually detects a failure and switches traffic or responsibility over to a working backup, automatically and fast enough that users barely notice.</span>'
    + '<span class="jp">冗長性とは、重要な何かを複数用意しておくことであり、単一の障害がシステム全体を停止させないようにする。フェイルオーバーとは、実際に障害を検知し、トラフィックや責任を稼働中のバックアップへと切り替える仕組みであり、自動的に、ユーザーがほとんど気づかないほど速く行われる。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">This is the exact same idea as the build farm\'s speculative re-execution (1.7), running a backup so a single struggling machine doesn\'t hold up everything, applied here to entire servers or data centers instead of individual build jobs.</span>'

    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Redundancy is having a spare tire. Failover is the moment you actually notice the flat and swap it in.</span><span class="jp">冗長性はスペアタイヤを持っていることである。フェイルオーバーは、実際にパンクに気づき、それを交換する瞬間である。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#B85C3E;--accent-dark:#7A3624;--tint:#F2DED4">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Strong vs. eventual consistency</span><span class="jp">強整合性と結果整合性</span></h3>'
    + '<p><span class="en">Strong consistency means every reader sees the exact same, most up-to-date answer immediately after any change. Eventual consistency means readers might briefly see a slightly stale answer right after a change, but all copies will converge to agreement given a little time. This is the same trade-off from 3.5\'s CAP theorem, shown here as an ongoing design choice.</span>'
    + '<span class="jp">強整合性とは、変更の直後、すべての読み取り側が全く同じ最新の答えを見ることを意味する。結果整合性とは、変更の直後は読み取り側が一時的に少し古い答えを見るかもしれないが、少し時間が経てばすべてのコピーが一致に収束することを意味する。これは3.5のCAP定理と同じトレードオフであり、ここでは継続的な設計上の選択として示されている。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A player\'s displayed friend count updating a second or two late is a reasonable eventual-consistency trade-off almost nobody will notice, whereas an item disappearing from inventory the instant it\'s sold, so it can\'t be sold twice, usually needs strong consistency.</span>'
    + '<span class="jp">プレイヤーの表示されるフレンド数が1〜2秒遅れて更新されることは、ほとんど誰も気づかない妥当な結果整合性のトレードオフである。一方、アイテムが売れた瞬間にインベントリから消え、二重販売されないようにすることは、通常強整合性を必要とする。</span></p></div>'

    + '<span><span class="en">Ask what actually breaks if this specific answer is a second late. If nothing real breaks, eventual consistency is probably fine.</span><span class="jp">この特定の答えが1秒遅れたら実際に何が壊れるかを問う。何も本当に壊れないなら、結果整合性でおそらく問題ない。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#B85C3E;--accent-dark:#7A3624;--tint:#F2DED4">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">The pattern this whole sheet has been pointing at</span><span class="jp">このシート全体が示してきたパターン</span></h3>'
    + '<p><span class="en">Scaling, fault tolerance, and consistency all trace back to the same underlying tension: spreading work and data across many machines buys growth and resilience, but spending effort to keep everything correctly coordinated is the real, ongoing cost, there\'s no way to get the benefit of distribution completely for free.</span>'
    + '<span class="jp">スケーリング、耐障害性、整合性はすべて、同じ根底の緊張関係に行き着く。作業とデータを多数のマシンに分散させることは成長と回復力を買うが、すべてを正しく調整し続けるために労力を費やすことが、本当の継続的なコストである。分散の恩恵を完全に無料で得る方法はない。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">This is precisely the tension the entire flagship build-system deep dive worked through in a specific, concrete case, the dependency graph, caching, and scheduling on Part 1 exist specifically to manage that same coordination cost, in service of the same underlying goal, correctness at scale.</span>'
    + '<span class="jp">これはまさに、分散ビルドシステムの旗艦の深掘り全体が、具体的で個別のケースとして取り組んできた緊張関係である。Part 1の依存関係グラフ、キャッシュ、スケジューリングは、まさにその同じ調整コストを管理するために存在し、同じ根底の目標、規模における正確性に奉仕している。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Distribution always trades coordination effort for growth and resilience. Every technique in this whole handbook is, underneath, a way of managing that one trade.</span><span class="jp">分散は常に、調整の労力を成長と回復力と引き換えにする。このハンドブック全体のあらゆる技術は、その根底では、その1つの取引を管理する方法である。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">When would vertical scaling actually be the right call over horizontal?</span><span class="jp">垂直スケーリングが実際に水平より正しい選択になるのはどんな場合か？</span></summary>'
    + '<div class="fu-a"><span class="en">When a workload genuinely can\'t be split across machines easily, or when the team\'s scale simply doesn\'t yet justify the added complexity of a distributed design.</span>'

    + '<details class="followup"><summary><span class="en">How do you decide if something needs strong consistency?</span><span class="jp">何かが強整合性を必要とするかどう判断するか？</span></summary>'
    + '<div class="fu-a"><span class="en">Ask what the real-world consequence is of two readers briefly disagreeing, if it\'s a minor cosmetic issue, eventual consistency is usually fine and cheaper; if it could cause a real error like double-spending, strong consistency is worth its extra coordination cost.</span>'
    + '<span class="jp">2人の読み取り側が一時的に食い違うことの現実世界での結果を問う。それが些細な見た目上の問題なら、結果整合性で通常十分でより安価である。二重使用のような本物のエラーを引き起こしうるなら、強整合性はその追加の調整コストに見合う。</span></div></details>'

    + '</div>';
  },
  'III-3': function(){ return ''
    + '<div style="'+styleFor('midnight')+'">'
    + '<div class="sheet-tag mono">SHEET 8 / 8</div>'
    + '<div class="sheet-eyebrow"><span class="en">3.8 · Security Fundamentals</span><span class="jp">3.8・セキュリティの基礎</span></div>'
    + '<h2 class="sec-headline"><span class="en">Precise words for an area easy to gloss over</span><span class="jp">見過ごされがちな領域を、正確な言葉で語る</span></h2>'
    + '<p class="sec-intro"><span class="en">Security is one of the easiest topics to sound reasonable about in casual conversation and one of the easiest to actually get wrong under a precise follow-up question, because the everyday version of the vocabulary blurs distinctions that genuinely matter: "login" gets used loosely for both proving who someone is and what they\'re allowed to do, and "encrypted" gets said as if it were one property instead of two separate protections covering two separate moments. This sheet is deliberately built to be precise about exactly those distinctions, since a follow-up question in this area is likely to specifically probe whether the difference is actually understood or just gestured at. This isn\'t an abstract or purely defensive topic either, it connects directly back to a concrete requirement stated all the way at the start of the build-system flagship, the access-isolation need between client projects in 1.1, which is a real instance of least privilege in action, not just a textbook example. The four ideas covered here, authentication versus authorization, the two moments encryption protects, least privilege, and defense in depth, are foundational enough that they apply regardless of which specific tools or vendor a system ends up using, which is exactly why they\'re covered here at the concept level rather than as a product feature list.</span>'
    + '<span class="jp">セキュリティは、日常会話の中ではもっともらしく聞こえさせるのが最も簡単でありながら、正確な追加質問の前では実際には最も間違いやすいトピックの1つである。なぜなら、日常的な語彙は、本当に重要な区別をぼやけさせてしまうからである。「ログイン」は、誰であるかを証明することと、何を許されているかということの両方に、ゆるく使われる。「暗号化されている」は、2つの別々の瞬間をカバーする2つの別々の保護ではなく、まるで1つの性質であるかのように語られる。このシートは、意図的にまさにそれらの区別について正確であるよう組み立てられている。この領域での追加質問は、その違いが実際に理解されているのか、それとも単に手振りで示されているだけなのかを、特に探ろうとする可能性が高いからである。これは抽象的な、あるいは純粋に防御的なトピックでもない。分散ビルドシステムの旗艦テーマの本当に冒頭で述べられた具体的な要件、1.1のクライアントプロジェクト間のアクセス分離の必要性に直接つながっており、それは教科書的な例ではなく、実際に機能している最小権限の原則の本物の実例である。ここで扱う4つの考え方、認証対認可、暗号化が保護する2つの瞬間、最小権限の原則、そして多層防御は、システムが最終的にどの特定のツールやベンダーを使うことになっても当てはまるほど基礎的であり、まさにそれが、製品機能の一覧としてではなく概念レベルでここで扱われる理由である。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> Authentication is proving who you are. Authorization is what you\'re allowed to do once you\'ve proven who you are, two genuinely different questions even though often handled together. Encryption scrambles data so it\'s unreadable without the right key, protecting it both while traveling over a network and while sitting in storage. Least privilege means giving every person and component only the minimum access it actually needs.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>認証とは、あなたが誰であるかを証明することである。認可とは、あなたが誰であるかが証明された後に、何をすることが許されているかであり、しばしば一緒に扱われるが、本質的に異なる2つの問いである。暗号化は、正しい鍵なしには読めないようデータを混ぜ合わせ、ネットワークを移動している間と、保存されている間の両方でそれを保護する。最小権限の原則とは、すべての人やコンポーネントに、実際に必要な最小限のアクセスだけを与えることである。</span></p>'

    + '<svg viewBox="0 0 760 200" width="100%" height="auto" role="img" aria-label="Defense in depth diagram">'

    + '<div class="module" style="--accent:#1F3A5F;--accent-dark:#12233A;--tint:#D6DEE8">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">Authentication vs. authorization, two different questions</span><span class="jp">認証と認可、2つの異なる問い</span></h3>'
    + '<p><span class="en">Authentication answers "who are you," typically proven with a password, a key, or a token. Authorization answers "given that we know who you are, what are you actually allowed to do," a completely separate question, someone can be successfully authenticated and still be authorized to do very little.</span>'
    + '<span class="jp">認証は「あなたは誰か」に答える。通常はパスワード、鍵、トークンで証明される。認可は「あなたが誰であるか分かった上で、実際に何をすることが許されているか」に答える、完全に別の問いである。誰かが認証に成功していても、認可されていることが非常に少ない場合がある。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A customer support agent logging into a company\'s internal tool is successfully authenticated, the system genuinely knows who they are, but authorization is what determines whether they\'re allowed to view a customer\'s payment details or only their support ticket history.</span>'
    + '<span class="jp">会社の社内ツールにログインするカスタマーサポート担当者は、正常に認証されている。システムは本当に彼らが誰かを知っている。しかし認可は、彼らが顧客の決済詳細を見ることを許されているのか、それともサポートチケットの履歴だけなのかを決める。</span></p></div>'

    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Encryption: in transit and at rest are two different protections</span><span class="jp">暗号化：転送中と保存中は2つの異なる保護である</span></h3>'
    + '<p><span class="en">Encryption in transit protects data while it\'s traveling across a network, so anyone intercepting the connection sees only scrambled data. Encryption at rest protects data while it\'s sitting in storage, so anyone who gains access to the storage itself still can\'t read it without the key. A system can have one without the other.</span>'
    + '<span class="jp">転送中の暗号化は、データがネットワークを移動している間にそれを保護し、接続を傍受した誰もが混ぜ合わされたデータしか見られないようにする。保存時の暗号化は、データが保存されている間にそれを保護し、ストレージ自体にアクセスできた誰かも、鍵なしにはそれを読めないようにする。システムは一方だけを持ち、もう一方を持たないこともありうる。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A game client sending a player\'s password to a login server needs encryption in transit, so anyone watching network traffic can\'t read the raw password. The database storing that password afterward needs encryption at rest, so unauthorized access to a backup file still can\'t read stored passwords directly.</span>'
    + '<span class="jp">プレイヤーのパスワードをログインサーバーに送信するゲームクライアントは転送中の暗号化を必要とし、ネットワークトラフィックを見ている誰も生のパスワードを読めないようにする。その後パスワードを保存するデータベースは保存時の暗号化を必要とし、バックアップファイルへの不正アクセスがあっても保存されたパスワードを直接読めないようにする。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Encryption in transit protects the envelope while it\'s being carried. Encryption at rest protects it once it\'s locked in the filing cabinet. Both matter, they protect different moments.</span><span class="jp">転送中の暗号化は、運ばれている間の封筒を守る。保存時の暗号化は、ファイリングキャビネットに施錠された後のそれを守る。どちらも重要であり、異なる瞬間を守っている。</span></span></div>'

    + '<div class="module" style="--accent:#1F3A5F;--accent-dark:#12233A;--tint:#D6DEE8">'

    + '<p><span class="en">Least privilege means every person, service, or component gets only the specific access it needs to do its actual job, nothing broader, so that if any one piece is ever compromised, the damage is contained to what that piece could touch, rather than everything.</span>'
    + '<span class="jp">最小権限の原則とは、すべての人・サービス・コンポーネントが、実際の仕事を行うために必要な特定のアクセスだけを与えられ、それより広くは与えられないことである。これにより、もし1つの部分が侵害されたとしても、被害はすべてではなく、その部分が触れられる範囲に限定される。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Recall the build farm\'s access-isolation requirement from 1.1, a client project\'s build data being invisible to another client\'s project is exactly least privilege in action, each project\'s access should only reach that project\'s own resources, not the whole farm.</span>'
    + '<span class="jp">1.1のビルドファームのアクセス分離要件を思い出してほしい。あるクライアントプロジェクトのビルドデータが別のクライアントプロジェクトから見えないことは、まさに機能している最小権限の原則である。各プロジェクトのアクセスは、ファーム全体ではなく、そのプロジェクト自身のリソースにのみ到達すべきである。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Give a key to the one room someone actually needs, not a master key to the whole building, just in case.</span><span class="jp">念のためにと建物全体のマスターキーを渡すのではなく、実際に必要な1つの部屋の鍵だけを渡す。</span></span></div>'

    + '<div class="module" style="--accent:#1F3A5F;--accent-dark:#12233A;--tint:#D6DEE8">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">Defense in depth: no single layer is trusted alone</span><span class="jp">多層防御：単一の層だけを信頼しない</span></h3>'
    + '<p><span class="en">A secure system doesn\'t rely on any single protection being perfect, it layers multiple independent protections so that if one fails, others still stand between an attacker and the actual damage. This mindset, assume any one layer could fail, is what separates a genuinely thought-through security design from one that just checked a single box.</span>'
    + '<span class="jp">安全なシステムは、単一の保護が完璧であることに頼らず、複数の独立した保護を層にすることで、1つが失敗しても他が攻撃者と実際の被害の間に立ち続けるようにする。どの1つの層も失敗しうると仮定するこの考え方が、単に1つのチェック項目を満たしただけの設計と、本当に考え抜かれたセキュリティ設計を分ける。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A payment system might combine authentication, authorization, encryption, and audit logging, no single one of these is treated as sufficient on its own.</span>'
    + '<span class="jp">決済システムは、認証、認可、暗号化、監査ログを組み合わせるかもしれない。これらのうちどれ1つとして、それ単体で十分だとは扱われない。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Don\'t build one strong wall, build several weaker walls in a row. An attacker who gets past one still has to get past the next.</span><span class="jp">1枚の強い壁を築くのではなく、何枚かの弱い壁を並べて築く。1枚を突破した攻撃者も、次の壁を突破する必要がある。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">What\'s a concrete example of authentication succeeding but authorization correctly failing?</span><span class="jp">認証は成功したが、認可が正しく失敗する具体例は？</span></summary>'
    + '<div class="fu-a"><span class="en">A logged-in regular player trying to access an admin-only moderation panel, the system knows exactly who they are, and correctly decides they\'re not authorized for that action, that\'s the system working as intended.</span>'
    + '<span class="jp">ログイン済みの一般プレイヤーが、管理者専用のモデレーションパネルにアクセスしようとする場合。システムは彼らが誰であるかを正確に把握しており、その操作を許可されていないと正しく判断する。それはシステムが意図通りに機能している状態である。</span></div></details>'
    + '<details class="followup"><summary><span class="en">Isn\'t encrypting everything at rest and in transit always the obviously right call?</span><span class="jp">保存時も転送時もすべてを暗号化することは常に明らかに正しい選択ではないか？</span></summary>'
    + '<div class="fu-a"><span class="en">Nearly always yes for anything sensitive, though it\'s worth naming the real trade-off honestly, encryption adds some computational overhead and key-management complexity, which is why it\'s worth being deliberate about what genuinely needs it.</span>'

    + '</div>';
  },
  'IV-1': function(){ return ''
    + '<div style="'+styleFor('wine')+'">'
    + '<div class="sheet-tag mono">SHEET 1 / 3</div>'

    + '<h2 class="sec-headline"><span class="en">"It works" is one dimension out of six</span><span class="jp">「動く」は6つの次元のうちの1つに過ぎない</span></h2>'
    + '<p class="sec-intro"><span class="en">A design can be technically correct, it does what it\'s supposed to do, and still be a genuinely poor architecture, because whether something works is only one of several independent dimensions experienced architects actually check a design against. A design that works but can\'t be operated without constant manual intervention, or works but costs ten times what the workload justifies, or works but has no real security boundary, has failed just as clearly as one that doesn\'t function at all, it just fails on a different axis. This kind of multi-dimensional evaluation is what separates an architect\'s review of a design from a developer\'s, a developer reasonably asks "does this work," an architect asks "does this work, and is it operable, secure, resilient, cost-proportional, and sustainable, all at once." This sheet works through six dimensions worth checking any design against, deliberately at the concept level rather than tied to any specific platform\'s branded framework, since the underlying reasoning is what actually gets tested by a follow-up question. This also connects directly back to 2.2\'s design arc, closing a design discussion by explicitly naming which of these dimensions a specific choice is trading against is exactly the kind of trade-off language that closing phase called for.</span>'
    + '<span class="jp">ある設計は技術的に正しく、求められていることを実行できていても、実は本当に貧弱なアーキテクチャであることがある。それが機能するかどうかは、経験豊富なアーキテクトが実際に設計をチェックするいくつかの独立した次元のうちの1つに過ぎないからである。機能はするが常に手動での介入なしには運用できない設計、機能はするがそのワークロードが正当化する額の10倍のコストがかかる設計、機能はするが本物のセキュリティ境界を持たない設計は、全く機能しない設計と同じくらい明確に失敗しているが、ただ別の軸で失敗しているだけである。この種の多次元的な評価こそが、開発者による設計レビューとアーキテクトによるそれを分ける。開発者は妥当にも「これは動くか」と問うが、アーキテクトは「これは動くか、そして運用可能か、安全か、回復力があるか、性能に見合ったコストか、持続可能か」を同時に問う。このシートでは、特定のプラットフォームのブランド付きフレームワークに結びつけるのではなく、意図的に概念レベルで、あらゆる設計をチェックする価値のある6つの次元を扱う。根底にある推論こそが、追加質問によって実際に試されるものだからである。これはまた2.2の設計の流れに直接つながる。設計の議論を締めくくる際に、特定の選択がこれらの次元のどれと引き換えになっているかを明示的に名指しすることは、まさにその締めくくりの段階が求めていたトレードオフの言葉そのものである。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> A single design can be "correct" from a pure functionality standpoint and still be a poor choice, because good architecture is evaluated across several independent dimensions at once. Six worth checking every design against: can it be operated day-to-day without heroics, is it actually secure, does it keep working through failure, is it fast enough for what it needs to do, is it worth what it costs, and what\'s its ongoing resource footing.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>ある設計は純粋な機能性の観点からは「正しい」ものでありながら、それでも貧弱な選択でありうる。優れたアーキテクチャは、複数の独立した次元にわたって同時に評価されるからである。あらゆる設計をチェックする価値のある6つの次元とは、日々の運用が英雄的な努力なしにできるか、実際に安全か、障害の中でも動き続けるか、必要な用途に対して十分に速いか、コストに見合う価値があるか、そして継続的な資源の負荷はどうか、である。</span></p>'

    + '<h3><span class="en">Operational excellence &amp; reliability</span><span class="jp">運用の卓越性と信頼性</span></h3>'
    + '<p><span class="en">Operational excellence asks whether a system can be understood, monitored, and fixed by the people actually running it day to day, not just whether it works once in a demo. Reliability asks whether the system keeps working through the failures that inevitably happen at scale. A system that\'s technically reliable but impossible to operate tends to become unreliable in practice anyway.</span>'
    + '<span class="jp">運用の卓越性は、デモで一度動くかどうかだけでなく、実際に日々それを運用する人々がそのシステムを理解し、監視し、修正できるかを問う。信頼性は、規模が大きくなれば必然的に起こる障害の中でもシステムが動き続けるかを問う。技術的には信頼できても運用不可能なシステムは、結局実務上は信頼できないものになりがちである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Recall 1.7\'s observability discussion, tracking cache hit rate, queue depth, and the critical-path-vs-wall-clock gap is operational excellence in action, giving the people running the system the visibility needed to actually operate it, not just hoping it works.</span>'
    + '<span class="jp">1.7の可観測性の議論を思い出してほしい。キャッシュヒット率、キュー深さ、クリティカルパス対実時間の差を追跡することは、まさに運用の卓越性の実践である。動いていることをただ願うのではなく、実際に運用するために必要な可視性をシステム運用者に与えている。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">A system nobody can operate confidently isn\'t actually reliable, it\'s just untested.</span><span class="jp">誰も自信を持って運用できないシステムは、実は信頼できるのではなく、単に検証されていないだけである。</span></span></div>'

    + '<div class="module" style="--accent:#7A2048;--accent-dark:#4A1230;--tint:#EDD8E0">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Security as one dimension among several</span><span class="jp">いくつかの次元の1つとしてのセキュリティ</span></h3>'
    + '<p><span class="en">Security (covered fully in 3.8) is one of these six dimensions, not a separate afterthought bolted on at the end. A design review that treats security as something to add later, after the "real" architecture is decided, has already made a mistake, since retrofitting authentication, encryption, and access boundaries is far more expensive than designing them in from the start.</span>'
    + '<span class="jp">セキュリティ（3.8で詳しく扱った）は、後から別に付け足す考慮事項ではなく、これら6つの次元の1つである。「本当の」アーキテクチャが決まった後にセキュリティを追加すべきものとして扱う設計レビューは、すでに間違いを犯している。認証、暗号化、アクセス境界を後から追加することは、最初から組み込むことよりはるかに高くつくためである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Deciding a build farm\'s access-isolation requirement (1.1) as a stated constraint before any component gets named, rather than bolting on isolation after the fact, is this exact principle in action, security as a day-one dimension, not a later patch.</span>'
    + '<span class="jp">ビルドファームのアクセス分離要件（1.1）を、コンポーネントが1つも名付けられる前に明示された制約として決めることは、後から分離を付け足すのではなく、まさにこの原則の実践である。セキュリティは後付けのパッチではなく、初日からの次元である。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Security bolted on after the fact is always more expensive than security designed in from the first requirement.</span><span class="jp">後から付け足すセキュリティは、最初の要件から設計に組み込むセキュリティより常に高くつく。</span></span></div>'
