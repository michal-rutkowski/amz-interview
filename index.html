    + '<div class="module" style="--accent:#2FA36B;--accent-dark:#0F5C3B;--tint:#DBF0E2">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">What actually gets hashed</span><span class="jp">実際にハッシュ化される対象</span></h3>'
    + '<p><span class="en">The cache key has to be a hash of every input that could affect the output: the source file\'s bytes, the exact compiler or cook flags used, the toolchain version, the target platform, and any environment variable that could change the result. Critically, the key is never the target\'s name or path, only what fed into producing it.</span>'
    + '<span class="jp">キャッシュキーは、出力に影響を与えうるすべての入力、ソースファイルのバイト列、使用したコンパイル/クックフラグの正確な内容、ツールチェーンのバージョン、対象プラットフォーム、結果を左右しうる環境変数のハッシュ値でなければならない。重要なのは、キーが決してターゲットの名前やパスではなく、それを生成するために投入されたものだけである点である。</span></p>'
    + '<p><span class="en">This is what makes cross-project reuse possible without any special-casing: if Project A and Project B both compile the exact same shared-engine header with identical flags and toolchain, the hash matches automatically. The system doesn\'t need to know these are two different projects, it only needs the hash to match.</span>'
    + '<span class="jp">これにより、特別な処理なしにプロジェクト間の再利用が可能になる。もしプロジェクトAとプロジェクトBが、共有エンジンの全く同じヘッダーを同一のフラグ・ツールチェーンでコンパイルすれば、ハッシュは自動的に一致する。システムはこれらが異なる2つのプロジェクトであることを知る必要すらなく、ハッシュが一致することだけを必要とする。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">cache_key = hash(source_bytes + compiler_flags + toolchain_version + target_platform + relevant_env_vars). If a shared-engine header is compiled identically by two different consumers of that engine, that single compile\'s result gets reused by both, with zero explicit coordination between them.</span>'
    + '<span class="jp">cache_key = hash(ソースバイト列 + コンパイルフラグ + ツールチェーンバージョン + 対象プラットフォーム + 関連する環境変数)。共有エンジンの同じヘッダーが2つの異なる利用元によって同一の条件でコンパイルされた場合、その1回のコンパイル結果が両方に再利用され、両者の間に明示的な連携は一切必要ない。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Hash what went IN, not what it\'s called. The name can lie; the contents can\'t.</span>'
    + '<span class="jp">名前ではなく、投入されたものをハッシュ化する。名前は嘘をつきうるが、中身は嘘をつかない。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#2FA36B;--accent-dark:#0F5C3B;--tint:#DBF0E2">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Why this beats timestamps</span><span class="jp">タイムスタンプ方式より優れている理由</span></h3>'
    + '<p><span class="en">Timestamp-based invalidation assumes a file\'s modification time reliably reflects whether its content changed. That assumption breaks constantly in real studio workflows: a fresh checkout, a full sync onto a new machine, or just touching a file without editing it all produce a new timestamp on byte-identical content.</span>'
    + '<span class="jp">タイムスタンプによる無効化判定は、ファイルの更新日時が内容の変更を正しく反映しているという前提に依存する。この前提は実際のスタジオのワークフローでは頻繁に崩れる。新規チェックアウト、新しいマシンへのフルシンク、あるいは内容を変えずにファイルに触れただけでも、バイト単位で同一の内容に対して新しいタイムスタンプが生成されてしまう。</span></p>'
    + '<p><span class="en">Content hashing sidesteps this entirely by only caring about the actual bytes. It\'s slightly more expensive to compute per file, but it never produces a false invalidation, which matters far more at scale than the small per-file hashing cost.</span>'
    + '<span class="jp">コンテンツハッシュ方式は、実際のバイト列だけを見ることでこの問題を完全に回避する。ファイルごとの計算コストはわずかに増えるが、誤った無効化を決して起こさない。この点は、大規模になるほど、わずかなハッシュ計算コストよりもはるかに重要になる。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A programmer does a full fresh Perforce sync onto a replacement laptop. Every synced file gets a brand-new OS-level timestamp, even though the content is byte-identical to what\'s already cached from their old machine. A timestamp-based system sees "all new files" and triggers a full rebuild, potentially hours long. A content-hash-based system hashes the bytes, finds the existing cache entries immediately, and the sync-triggered build should be nearly instant.</span>'
    + '<span class="jp">プログラマーが交換用の新しいノートPCにPerforceのフルシンクを行う。同期された全ファイルにOSレベルの新しいタイムスタンプが付与されるが、内容は古いマシンのキャッシュ済みファイルとバイト単位で同一である。タイムスタンプ方式のシステムは「全部新しいファイル」と判断し、数時間かかりうるフルビルドを引き起こす。コンテンツハッシュ方式のシステムはバイト列をハッシュ化し、既存のキャッシュエントリを即座に見つけるため、シンクをきっかけとしたビルドはほぼ瞬時に終わるはずである。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">A timestamp says when someone touched it. A hash says whether it actually changed. Only one of those is the question you care about.</span>'
    + '<span class="jp">タイムスタンプは誰かがいつ触れたかを語る。ハッシュは実際に変わったかどうかを語る。気にすべき問いはそのうち片方だけである。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#2FA36B;--accent-dark:#0F5C3B;--tint:#DBF0E2">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Correctness and verification</span><span class="jp">正確性と検証</span></h3>'
    + '<p><span class="en">A cache is only trustworthy if identical inputs always produce byte-identical outputs. When that guarantee silently breaks, non-determinism, embedded timestamps, floating-point drift across hardware, uninitialized memory, the cache doesn\'t fail loudly. It just quietly stops helping, since every "identical" input now hashes its output differently and looks like a fresh miss every time.</span>'
    + '<span class="jp">キャッシュは、同一の入力から常にバイト単位で同一の出力が得られる場合にのみ信頼できる。この保証が静かに崩れると、非決定性、埋め込まれたタイムスタンプ、ハードウェア間の浮動小数点誤差、未初期化メモリの読み取りなど、キャッシュは派手に失敗するわけではない。ただ静かに役に立たなくなる。すべての「同一」入力が毎回異なる出力ハッシュを生成し、常に新規ミスのように見えてしまうためである。</span></p>'
    + '<p><span class="en">Verification means periodically rebuilding from the exact same input twice and diffing the resulting output hashes. Any mismatch is treated as a build correctness bug to fix in the toolchain, not something to work around in the cache layer.</span>'
    + '<span class="jp">検証とは、全く同じ入力から2回ビルドし、得られた出力ハッシュを比較することを定期的に行うことである。不一致が見つかった場合は、キャッシュ層で回避すべき問題としてではなく、ツールチェーン側で修正すべきビルドの正確性のバグとして扱う。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A shader compiler that embeds a wall-clock compile timestamp string into its output binary for debug purposes will produce a different output hash every run, even from byte-identical source. That\'s an invisible cache-hit-rate killer until someone actually diffs two "identical" builds, notices the outputs don\'t match, then patches the toolchain to strip or pin the timestamp.</span>'
    + '<span class="jp">デバッグ目的で出力バイナリに実時間のコンパイルタイムスタンプ文字列を埋め込むシェーダーコンパイラは、ソースがバイト単位で同一であっても、実行のたびに異なる出力ハッシュを生成してしまう。これは、誰かが実際に2つの「同一」ビルドを比較し、出力が一致しないことに気づき、タイムスタンプを除去または固定するようツールチェーンを修正するまで、目に見えない形でキャッシュヒット率を破壊し続ける。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">A cache that can\'t be trusted is worse than no cache, it costs storage and gives nothing back.</span>'
    + '<span class="jp">信頼できないキャッシュは、キャッシュがないより悪い。ストレージを消費しながら何も返してくれない。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#2FA36B;--accent-dark:#0F5C3B;--tint:#DBF0E2">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">Dedup is a side effect, not a system</span><span class="jp">重複排除は仕組みではなく副産物</span></h3>'
    + '<p><span class="en">Deduplication doesn\'t need its own separate pass if outputs are stored keyed by their own content hash. If two completely different build jobs happen to produce byte-identical output, they collapse to a single physical stored copy automatically, purely as a consequence of how the storage is addressed.</span>'
    + '<span class="jp">出力がそれ自体のコンテンツハッシュをキーとして保存されていれば、重複排除のために別途専用のパスや基盤を用意する必要はない。全く異なる2つのビルドジョブがたまたまバイト単位で同一の出力を生成した場合、ストレージのアドレス方式そのものの結果として、自動的に1つの物理コピーへ統合される。</span></p>'
    + '<p><span class="en">Worth stating explicitly in an interview, since it shows you understand dedup isn\'t a separate feature to build, it falls out of the caching design for free.</span>'
    + '<span class="jp">これは面接で明示的に言及する価値がある。重複排除は別途構築すべき機能ではなく、キャッシュ設計から自然に導かれるものであるという理解を示せるためである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">If one texture is referenced identically by 40 different levels across 3 projects that share an engine, all 40 level-cook jobs might each touch that texture, but the processed output only gets stored once, since all 40 results hash to the same value and collapse into a single physical blob. Worth tracking cache hit rate and physical dedup ratio as two separate metrics, since they measure different things.</span>'
    + '<span class="jp">1つのテクスチャが、エンジンを共有する3つのプロジェクトにまたがる40個の異なるレベルから同一の形で参照されているとする。40個のレベルクックジョブそれぞれがそのテクスチャに触れる可能性があるが、処理済みの実際の出力は1回しか保存されない。40個すべての結果が同じ値にハッシュ化され、1つの物理的なblobに統合されるためである。キャッシュヒット率と物理ストレージの重複排除率は、異なるものを測定しているため、別々の指標として追跡する価値がある。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">You don\'t build a deduplication system, you get it for free by addressing storage with the content\'s own hash.</span>'
    + '<span class="jp">重複排除システムを構築するのではない。コンテンツ自身のハッシュでストレージをアドレス指定すれば、無料で手に入る。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">How do you know your cache is correct?</span><span class="jp">キャッシュが正しいことをどう保証するのか？</span></summary>'
    + '<div class="fu-a"><span class="en">Determinism testing: periodically rebuild from the same inputs and diff the output hashes. Any mismatch is a build bug, not a cache bug.</span>'
    + '<span class="jp">決定性テストを行う。定期的に同じ入力から再ビルドし、出力ハッシュを比較する。不一致はビルド自体のバグとして扱う。</span></div></details>'
    + '<details class="followup"><summary><span class="en">Doesn\'t hashing every input add overhead to every build?</span><span class="jp">すべての入力をハッシュ化することは、すべてのビルドにオーバーヘッドを追加してしまわないのか？</span></summary>'
    + '<div class="fu-a"><span class="en">Yes, worth acknowledging that trade-off directly rather than glossing over it. Hashing has a real cost, but it\'s small, especially since I/O-bound systems are usually reading those same bytes anyway, next to the cost of an unnecessary rebuild, which can run minutes to hours. The trade-off only looks bad if you ignore how expensive the alternative failure mode actually is.</span>'
    + '<span class="jp">その通りであり、この点を曖昧にせず正面から認める価値がある。ハッシュ化には実際のコストがかかるが、それは小さい。特にI/Oが支配的なシステムでは、どのみち同じバイト列を読み込んでいるためである。それに対し、不要な再ビルドのコストは数分から数時間に及ぶ可能性がある。この比較は、代替の失敗モードが実際にどれだけ高コストかを無視した場合にのみ、悪いトレードオフに見える。</span></div></details>'
    + '<div class="say-out-loud"><div class="mono"><span class="en">Say this out loud</span><span class="jp">面接でそのまま口に出す一言</span></div>'
    + '<p><span class="en">"I\'d hash every input, not just the target name, so identical work anywhere in the farm becomes a cache hit. That only pays off if builds stay deterministic, so I\'d treat determinism testing as a first-class requirement, not an afterthought."</span>'
    + '<span class="jp">「ターゲット名だけでなく、すべての入力をハッシュ化します。これによりファーム内のどこで発生した同一の作業もキャッシュヒットになります。ただしこれはビルドの決定性が保たれている場合に限られるため、決定性テストを最初から必須要件として組み込みます。」</span></p></div>'
    + '</div>';

    + '<div class="sheet-tag mono">SHEET 4 / 9</div>'
    + '<div class="sheet-eyebrow"><span class="en">1.4 · Multi-Tier Caching</span><span class="jp">1.4・多層キャッシュ</span></div>'
    + '<h2 class="sec-headline"><span class="en">Check fast before you check slow</span><span class="jp">遅いところを確認する前に、速いところを確認する</span></h2>'
    + '<p class="sec-intro"><span class="en">Once caching is established as the biggest lever available, an easy mistake is to think of "the cache" as a single thing sitting somewhere in the middle of the farm. In practice, a single shared cache creates its own bottleneck: every worker checking it for every piece of work generates enormous network traffic, and even work repeated on the exact same machine still has to round-trip over the network to confirm it. At the same time, keeping every past result available forever, everywhere, isn\'t realistic either, storage has real costs and real limits. The solution studios actually use is a hierarchy of caches, layered from very fast and small to slow and effectively unlimited, checked in a specific order rather than treated as one flat pool. Getting this layering right is what determines whether the caching idea from the previous sheet actually delivers on its promise at real scale, or quietly becomes a new bottleneck of its own. One cache isn\'t one thing, it\'s a hierarchy, and the order you check it in matters as much as whether you have it at all.</span>'
    + '<span class="jp">キャッシュが利用可能な最大のレバーだと分かると、「キャッシュ」をファームのどこかにある単一のものとして考えてしまいがちである。しかし実際には、単一の共有キャッシュはそれ自体がボトルネックになる。すべてのワーカーがすべての作業についてそれを確認すれば、膨大なネットワークトラフィックが発生し、全く同じマシン上で繰り返される作業でさえ、それを確認するためにネットワークを往復しなければならない。同時に、過去のすべての結果をあらゆる場所に永久に保持しておくことも現実的ではない。ストレージには実際のコストと実際の限界があるためである。スタジオが実際に採用している解決策は、非常に高速で小容量なものから低速だが実質無制限なものまで層になったキャッシュの階層であり、単一のプールとしてではなく、特定の順序で確認する。この階層化を正しく行うことこそが、前のシートで扱ったキャッシュという考え方が実際の規模で本当に約束を果たすのか、それとも静かに新たなボトルネックになってしまうのかを分ける。キャッシュは単一のものではなく階層であり、どの順序で確認するかは、そもそもキャッシュを持っているかどうかと同じくらい重要である。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> Multi-tier caching means splitting your cache into layers, from very fast and small (local disk on each worker) to slower and effectively unlimited (a cold archive), checking them in order from fastest to slowest before actually doing the work.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>多層キャッシュとは、キャッシュを層に分けることを意味する。非常に高速で容量の小さい層（各ワーカーのローカルディスク）から、低速だが実質的に容量が無制限な層（コールドアーカイブ）までを用意し、実際に作業を行う前に、速い層から遅い層へと順に確認していく方式である。</span></p>'
    + '<p><span class="en"><strong>Why it matters:</strong> Route every lookup to one shared cache and network traffic scales badly, even repeated work on the SAME machine round-trips over the network. But you can\'t afford to keep everything forever on local disk either. Tiering balances speed against capacity and cost.</span>'
    + '<span class="jp"><strong>重要な理由：</strong>すべての検索を1つの共有キャッシュに集中させると、ネットワークトラフィックのスケールが悪化し、同じマシン上での作業の繰り返しでさえネットワーク往復が発生してしまう。一方で、すべてを永久にローカルディスクに保持しておくこともできない。階層化により、速度と容量・コストのバランスを取ることができる。</span></p>'
    + '<div class="primer-when">'
    + '<div class="pw-yes"><div class="pw-label"><span class="en">USE IT WHEN</span><span class="jp">使うべき場合</span></div><ul>'
    + '<li><span class="en">Work repeats both within a single worker\'s session and across the whole farm</span><span class="jp">1つのワーカーのセッション内でも、ファーム全体でも作業の繰り返しがある</span></li>'
    + '<li><span class="en">Network bandwidth to a shared cache is a real bottleneck</span><span class="jp">共有キャッシュへのネットワーク帯域が実際のボトルネックになっている</span></li>'
    + '<li><span class="en">Storage cost matters, a cold tier gives you cheap long-term archival</span><span class="jp">ストレージコストが重要で、コールド層を安価な長期アーカイブとして使いたい</span></li>'
    + '</ul></div>'
    + '<div class="pw-no"><div class="pw-label"><span class="en">SKIP IT WHEN</span><span class="jp">見送るべき場合</span></div><ul>'
    + '<li><span class="en">A single shared cache is already fast enough for a small farm</span><span class="jp">小規模なファームで、単一の共有キャッシュだけですでに十分高速</span></li>'
    + '<li><span class="en">Worker local disks are ephemeral (spot instances destroyed often), making L1 low value</span><span class="jp">ワーカーのローカルディスクが一時的（頻繁に破棄されるスポットインスタンスなど）で、L1の価値が低い</span></li>'
    + '</ul></div>'
    + '</div>'
    + '</div>'

    + '<svg viewBox="0 0 760 260" width="100%" height="auto" role="img" aria-label="Multi-tier cache lookup diagram">'

    + '<g font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700">'

    + '<rect x="500" y="195" width="220" height="50" fill="#0E5C56" stroke="#1B2430" stroke-width="3"/><text x="610" y="216" text-anchor="middle" fill="#FFFFFF">ACTUALLY BUILD</text><text x="610" y="234" text-anchor="middle" fill="#D8F0EE" font-size="10.5">write back to L1 + L2</text>'

    + '<div class="module" style="--accent:#1E9E96;--accent-dark:#0E5C56;--tint:#D8F0EE">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">Three tiers, three jobs</span><span class="jp">3つの層、3つの役割</span></h3>'
    + '<p><span class="en">L1 is the local disk on the worker itself: fastest, avoids the network round-trip entirely, but only useful if the same worker reruns similar work (session locality). L2 is a shared cluster cache reachable by every worker in the farm, this is what enables cross-project, cross-developer dedup, a hit here means someone, somewhere already built this. L3 is a cold long-term archive, kept for release builds and audit trail, rarely accessed but never thrown away.</span>'
    + '<span class="jp">L1はワーカー自身のローカルディスクであり、最も高速で、ネットワーク往復を完全に回避できるが、同じワーカーが類似の作業を繰り返す場合（セッション局所性）にのみ有効である。L2はファーム内のすべてのワーカーからアクセス可能な共有キャッシュクラスターであり、プロジェクト間・開発者間の重複排除を可能にする層である。ヒットが得られれば、それは「どこかで誰かがすでにこれをビルドした」ことを意味する。L3はコールド・長期アーカイブであり、リリースビルドや監査証跡のために保持される。アクセス頻度は低いが、破棄されることはない。</span></p>'
    + '<p><span class="en">Each tier trades speed for reach. Lookup order should always go L1 → L2 → L3 → actually build, since falling through to a slower lookup means paying for a hit you could have gotten faster.</span>'
    + '<span class="jp">各層は速度と到達範囲をトレードオフしている。検索の順序は常にL1→L2→L3→実際にビルド、とすべきである。より遅い検索に落ち込むということは、本来もっと速く得られたはずのヒットに余計なコストを払うことになるためである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A texture cook job runs on Worker-17. If it already has that exact hash in its local L1 cache, the lookup costs microseconds. If not, it checks the shared L2 cluster cache, maybe 50–200ms round trip. If even that misses, the job actually runs, then the result is written back to both L1 and L2.</span>'
    + '<span class="jp">テクスチャクックジョブがWorker-17で実行される。すでにその正確なハッシュをL1ローカルキャッシュに持っていれば、検索コストはマイクロ秒単位である。持っていなければ、共有L2クラスターキャッシュを確認する。往復でおよそ50〜200ミリ秒かかる。それでもミスした場合、ジョブは実際に実行され、その結果はL1とL2の両方に書き戻される。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Your desk drawer (L1), the office supply room (L2), and the off-site warehouse (L3). Check your drawer first.</span>'
    + '<span class="jp">自分の机の引き出し（L1）、オフィスの備品室（L2）、そして遠隔倉庫（L3）。まず引き出しを確認する。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#1E9E96;--accent-dark:#0E5C56;--tint:#D8F0EE">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Eviction weighted by rebuild cost, not just recency</span><span class="jp">再構築コストで重み付けした削除ポリシー</span></h3>'
    + '<p><span class="en">Standard LRU eviction assumes all cached items are equally expensive to regenerate, which is false in a build farm. A tiny asset that takes 2 seconds to rebuild and a 40-minute shader compile aren\'t equally expensive to evict, even accessed at the same time.</span>'
    + '<span class="jp">標準的なLRU削除方式は、キャッシュされたすべての項目が同じコストで再生成できることを前提としているが、ビルドファームではこれは正しくない。再構築に2秒しかかからない小さなアセットと40分かかるシェーダーコンパイルは、同じタイミングでアクセスされたとしても削除する価値が同じではない。</span></p>'
    + '<p><span class="en">A cost-weighted policy scores entries by rebuild_cost divided by storage_size, so an expensive item survives longer than a cheap one of the same size, even if accessed slightly less recently.</span>'
    + '<span class="jp">再構築コストで重み付けした削除ポリシーは、各エントリを「再構築コスト÷ストレージサイズ」で評価する。これにより、多少アクセスが古くても、高コストな項目は同じサイズの安価な項目より長く生き残る。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">L1 disk is tight. A small icon (2 seconds to reprocess) and a 40-minute shader permutation set are both eviction candidates. Plain LRU evicts whichever was accessed less recently, even if that\'s the shader set, a bad trade since it costs 1,200x more to regenerate. Cost-weighted eviction keeps it cached longer regardless.</span>'
    + '<span class="jp">L1のディスク容量が逼迫している。小さなアイコン（再処理2秒）と40分のシェーダーパーミュテーションセットの両方が削除候補になっている。単純なLRUはアクセスが古い方を削除するが、それがシェーダーセットであれば悪いトレードオフである。再生成コストが1200倍もかかるためである。コスト重み付けの削除であれば、それでも長くキャッシュに残す。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Don\'t throw out the thing that took all day to bake just because you touched it an hour before the two-second thing.</span>'
    + '<span class="jp">1日がかりで焼き上げたものを、2秒でできるものより1時間早く触っただけで捨ててはいけない。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#1E9E96;--accent-dark:#0E5C56;--tint:#D8F0EE">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Cross-tier consistency and staleness</span><span class="jp">層をまたいだ整合性と古さの問題</span></h3>'
    + '<p><span class="en">With multiple tiers, a stale entry can survive in a faster tier after being corrected in a slower, authoritative one. The registry (from 1.2) is the natural place to record the current authoritative hash, and every tier lookup should validate against it, not just trust whatever\'s locally present.</span>'
    + '<span class="jp">複数の層があると、より遅い・信頼できる層で修正された後でも、速い層で古いエントリが生き残ってしまうことがある。（1.2の）レジストリは現在の信頼できるハッシュを記録する自然な場所であり、すべての層の検索はローカルに存在するものを単に信頼するのではなく、レジストリと照合すべきである。</span></p>'
    + '<p><span class="en">In practice, L1/L2 entries are opportunistic accelerators, not sources of truth. If a lookup finds something whose hash doesn\'t match what the registry currently expects, it\'s discarded and treated as a miss, not silently served.</span>'
    + '<span class="jp">実務上、L1/L2のエントリはあくまで日和見的な高速化手段であり、信頼できる情報源ではない。見つかったものがレジストリの現在の期待値と一致しなければ、破棄され、黙って提供されるのではなくミスとして扱われる。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Worker-17\'s L1 still has yesterday\'s build of a shared header, but a determinism bug was found and the toolchain patched overnight, changing the correct hash. Checking L1 blindly would serve the stale result. Validating against the registry\'s current hash before trusting an L1 hit catches this.</span>'
    + '<span class="jp">Worker-17のL1には、共有ヘッダーの昨日のビルド結果がまだキャッシュされているが、決定性のバグが発見されツールチェーンが一晩でパッチされ、正しいハッシュが変わったとする。L1を無条件に確認すると古い結果を提供してしまう。ヒットを信頼する前にレジストリの現在のハッシュと照合すれば、これを検知できる。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Local cache is a shortcut, not an authority.</span><span class="jp">ローカルキャッシュは近道であって、権威ではない。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#1E9E96;--accent-dark:#0E5C56;--tint:#D8F0EE">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">When tiering pays off vs. when it\'s overhead</span><span class="jp">階層化が報われる場合と、オーバーヘッドになる場合</span></h3>'
    + '<p><span class="en">Tiering adds real complexity, more code paths, more operational surface area. It pays off specifically when access patterns have locality to exploit, either within one worker\'s session or across the farm.</span>'
    + '<span class="jp">階層化には実際のコストが伴う。コードパスが増え、運用面の負担も増える。これが価値を持つのは、1つのワーカーのセッション内、あるいはファーム全体で、活用できる局所性がアクセスパターンにある場合である。</span></p>'
    + '<p><span class="en">If access is essentially random, the L1/L2 split buys little, nothing cached locally is likely to be reused before eviction. Knowing this trade-off, and saying it out loud, is itself worth demonstrating.</span>'
    + '<span class="jp">アクセスが本質的にランダムであれば、L1/L2の分割はほとんど利益を生まない。ローカルにキャッシュしたものが削除前に再利用される可能性が低いためである。このトレードオフを理解し言葉にできること自体が価値を示す。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A studio doing mostly one-off procedural generation with unique seeds per build may see very low L1 hit rates, since each job\'s inputs are genuinely novel. The local tier is mostly wasted disk, it may be worth simplifying to just L2+L3.</span>'
    + '<span class="jp">ビルドごとに一意のシードを使う手続き型生成を主に行うスタジオでは、各ジョブの入力が本質的に毎回新しいため、L1ヒット率が非常に低くなることがある。ローカル層はディスク容量の無駄になっており、L2＋L3だけに単純化した方が良いかもしれない。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Tiering is a bet on locality. Measure hit rate per tier before assuming the bet paid off.</span>'
    + '<span class="jp">階層化は局所性への賭けである。賭けが報われたかは、層ごとのヒット率を測定して確認する。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">How do you decide L1 cache size per worker?</span><span class="jp">ワーカーごとのL1キャッシュサイズはどう決めるのか？</span></summary>'
    + '<div class="fu-a"><span class="en">Size it to comfortably hold one worker\'s typical working set for a single session, not the whole farm\'s cache. Oversizing wastes local disk, undersizing thrashes and loses session-locality benefit. Start from measured working-set size and tune from there.</span>'
    + '<span class="jp">ファーム全体ではなく、1台のワーカーが1回のセッションで通常必要とする作業セットを快適に収められる大きさにする。大きすぎると無駄になり、小さすぎるとスラッシングが起きセッション局所性の恩恵を失う。実測した作業セットサイズから調整する。</span></div></details>'
    + '<details class="followup"><summary><span class="en">What happens if L2 (the shared cache) goes down?</span><span class="jp">L2（共有キャッシュ）がダウンした場合はどうなるのか？</span></summary>'
    + '<div class="fu-a"><span class="en">Workers should gracefully fall through to L3 or to actually rebuilding, treating L2 unavailability as degraded performance, not a hard failure. Caching layers should never be a single point of failure for correctness, only for speed.</span>'
    + '<span class="jp">ワーカーはL3、あるいは実際の再ビルドへと段階的に移行すべきであり、L2の利用不可を致命的な障害ではなく性能低下として扱う。キャッシュ層は速度に関しては単一障害点になり得ても、正確性に関しては決してそうであってはならない。</span></div></details>'
    + '<div class="say-out-loud"><div class="mono"><span class="en">Say this out loud</span><span class="jp">面接でそのまま口に出す一言</span></div>'
    + '<p><span class="en">"I\'d tier the cache rather than treat it as one pool: local disk on each worker for the fastest hits, a shared cluster tier so one project\'s work benefits every other project, and cold archive for anything long-term. And I\'d weight eviction by rebuild cost, not just recency."</span>'
    + '<span class="jp">「キャッシュを1つのプールとして扱うのではなく階層化します。最速のヒットのために各ワーカーのローカルディスク、あるプロジェクトの作業が他のすべてのプロジェクトにも効くよう共有クラスター層、そして長期保存にはコールドアーカイブです。また、削除の判断は単なるアクセスの新しさではなく、再構築コストで重み付けします。」</span></p></div>'
    + '</div>';
  },

    + '<div class="sheet-eyebrow"><span class="en">1.5 · Scheduling</span><span class="jp">1.5・スケジューリング</span></div>'
    + '<h2 class="sec-headline"><span class="en">Turn a pile of jobs into an execution plan</span><span class="jp">ジョブの山を、実際の実行計画に変える</span></h2>'
    + '<p class="sec-intro"><span class="en">By this point, the design has a correct dependency graph telling it what needs rebuilding, and a caching system that avoids redoing identical work. But neither of those, on its own, decides which job actually runs on which machine, right now, given everything else competing for the same limited pool of workers. That decision is made continuously, thousands of times a day, by the scheduler, and how well it makes that decision determines whether the theoretical speed of the design shows up as real, felt speed for the people waiting on builds. A scheduler that ignores which work is actually urgent, what resources a job actually needs, or how fairly capacity is shared across teams can waste enormous amounts of otherwise well-designed capacity. This is also where multi-tenancy, the requirement flagged all the way back on the very first sheet, actually gets enforced or fails to be enforced in practice. Every earlier design decision, the graph, the cache, fairness, only matters if the scheduler actually enforces it.</span>'
    + '<span class="jp">ここまでで、設計には何を再ビルドすべきかを教えてくれる正しい依存関係グラフと、同一の作業をやり直さないキャッシュシステムが備わっている。しかし、そのどちらも、それ単体では、今この瞬間、限られたワーカープールを奪い合う他のすべてを踏まえた上で、どのジョブがどのマシンで実際に動くかを決めてはくれない。その決定は、1日に何千回も継続的にスケジューラーによって下されており、その決定の質が、設計上の理論的な速さが、ビルドを待つ人々にとって実際に体感できる速さとして現れるかどうかを左右する。実際に何が緊急なのか、ジョブが本当に必要としているリソースは何か、チーム間でキャパシティがどれだけ公平に分配されているかを無視するスケジューラーは、せっかく優れた設計のキャパシティを大きく無駄にしてしまう。ここはまた、最初のシートで触れたマルチテナンシーという要件が、実際に実行時に守られるのか、それとも守られないのかが決まる場所でもある。これまでのすべての設計判断、グラフ、キャッシュ、公平性は、スケジューラーが実際にそれを実行に反映してはじめて意味を持つ。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> Scheduling is the process of deciding which job runs on which worker, and in what order, given limited capacity and a queue of pending work. It\'s the layer that turns "here\'s a pile of jobs and 50 machines" into an actual execution plan.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>スケジューリングとは、限られたキャパシティと待機中のジョブのキューがある中で、どのジョブをどのワーカーで、どの順序で実行するかを決定する処理である。「ジョブの山と50台のマシン」を、実際の実行計画へと変える層である。</span></p>'
    + '<p><span class="en"><strong>Why it matters:</strong> A perfect graph and a perfect cache don\'t help if the scheduler wastes capacity or ignores resource fit. Scheduling is where every earlier decision, critical path, job heterogeneity, tenant fairness, actually gets enforced.</span>'

    + '<div class="primer-when">'

    + '<div class="module-num">01 / 04</div>'

    + '<span class="jp">これには、キューを単なるフラットなリストとして扱うのではなく、グラフに対して「このジョブは現在のクリティカルパス上にあるか」を問い合わせる必要がある。多くの場合、全体の完了時刻に影響を与えずにどれだけ遅らせられるかという「スラック」から優先度を導き、ジョブにタグ付けする。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'

    + '<span class="jp">40分のエンジンコンパイルと全体で50分の下限を思い出してほしい。それが実行可能になった時点で無関係な小さなジョブが30件すでにキューにあったとする。クリティカルパスを認識するスケジューラーは、スラックのあるジョブよりもそれを先に進める。遅らせるとチェンジリスト全体が遅れるためである。</span></p></div>'

    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Resource-aware bin-packing</span><span class="jp">リソースを考慮したビンパッキング</span></h3>'
    + '<p><span class="en">Different job types need different resource profiles. Bin-packing means matching a job\'s actual footprint, CPU, memory, expected I/O, to a worker that has room, rather than treating slots as interchangeable.</span>'
    + '<span class="jp">異なる種類のジョブは異なるリソース特性を必要とする。ビンパッキングとは、すべてのスロットを互換可能なものとして扱うのではなく、ジョブの実際のフットプリント（CPU、メモリ、想定I/O）を、実際に余裕のあるワーカーに一致させることである。</span></p>'

    + '<p><span class="en">With 6–8 projects sharing 50 workers, fairness needs to be explicit policy, not an emergent property. Common approaches: guaranteed minimums per project, or weighted fair queueing over the remaining pool.</span>'
    + '<span class="jp">6〜8プロジェクトが50台を共有する場合、公平性は自然に生まれる性質ではなく、明示的なポリシーとして設計する必要がある。よくある方式は、プロジェクトごとの保証最低割り当てか、残りのプールに対する重み付け公平キューイングである。</span></p>'

    + '<h3><span class="en">Data-locality-aware placement</span><span class="jp">データ局所性を考慮した配置</span></h3>'
    + '<p><span class="en">Game builds are I/O-bound, moving gigabytes of data, not just compute-bound. A scheduler that picks "any free worker" may place a job on a machine that has to pull inputs fresh over the network, when a worker with those inputs warm in L1 sits idle nearby.</span>'
    + '<span class="jp">ゲームビルドはI/Oバウンドであり、単に計算量が多いだけでなく、数ギガバイトのデータを移動させる作業である。「空いているワーカーならどこでも良い」とするスケジューラーは、すぐ近くにその入力がL1にすでに温まった状態で空いているワーカーがあるにもかかわらず、必要な入力をすべて新規に取得しなければならないマシンにジョブを配置してしまうことがある。</span></p>'

  '10-7': function(){ return ''
    + '<div style="'+styleFor('plum')+'">'
    + '<div class="sheet-tag mono">SHEET 6 / 9</div>'
    + '<div class="sheet-eyebrow"><span class="en">1.6 · Determinism</span><span class="jp">1.6・決定性</span></div>'
    + '<h2 class="sec-headline"><span class="en">The quiet assumption everything else depends on</span><span class="jp">他のすべてが静かに前提としているもの</span></h2>'
    + '<p class="sec-intro"><span class="en">Every idea covered so far, the graph correctly identifying what changed, the cache safely reusing past results, quietly rests on one assumption that\'s never been stated out loud until now: that building the same input twice always produces exactly the same output. Most engineers never have to think about this assumption directly, because most everyday software just works this way by default. But a surprising number of common tools and processes, especially in game asset pipelines, don\'t actually guarantee it, for reasons that have nothing to do with bugs in anyone\'s logic. When that assumption quietly breaks, the system doesn\'t crash or throw an error, which is exactly what makes it dangerous. Nothing in this system fails loudly when this breaks. It just gets slower, and it\'s hard to tell why, sometimes for months, while everyone assumes the cache or the hardware is simply inadequate rather than suspecting the real cause.</span>'
    + '<span class="jp">これまでに扱ったすべての考え方、変更点を正しく特定するグラフ、過去の結果を安全に再利用するキャッシュは、これまで一度も声に出して述べられてこなかった、ある1つの前提の上に静かに成り立っている。それは、同じ入力から2回ビルドすれば、常に全く同じ出力が得られる、という前提である。日常的なソフトウェアの多くはデフォルトでこのように動作するため、たいていのエンジニアはこの前提について直接考える必要はない。しかし、驚くほど多くの一般的なツールや処理は、特にゲームのアセットパイプラインにおいて、誰のロジックのバグとも関係のない理由で、実際にはこれを保証していない。この前提が静かに崩れても、システムはクラッシュもエラーも出さない。まさにそれこそが危険な理由である。これが崩れても、このシステムの中で派手に失敗するものは何もない。ただ徐々に遅くなっていくだけで、原因がわかりにくく、時には数ヶ月もの間、誰もが本当の原因を疑うことなく、単にキャッシュやハードウェアが不十分なのだと思い込んでしまう。</span></p>'

    + '<div class="module" style="--accent:#B23E8C;--accent-dark:#6E1F57;--tint:#F5DFEE">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">What breaks determinism</span><span class="jp">決定性を壊す原因</span></h3>'
    + '<p><span class="en">Common causes: embedded timestamps (compile time or build IDs baked into binaries for debug info), floating-point differences across hardware or optimization levels, uninitialized memory in output, unordered iteration (hash-map order that varies run to run), and multi-threaded processes where output ordering depends on which thread finishes first.</span>'
    + '<span class="jp">よくある原因：埋め込まれたタイムスタンプ（デバッグ情報のためバイナリに焼き込まれるコンパイル時刻やビルドID）、ハードウェアや最適化レベルによる浮動小数点の差異、出力に含まれる未初期化メモリ、順序が保証されない反復処理（実行のたびに変わるハッシュマップの順序）、そしてどのスレッドが先に終わるかで出力順序が変わるマルチスレッド処理。</span></p>'
    + '<p><span class="en">None of these are exotic, they\'re common defaults in general-purpose tools not designed for reproducible builds, which is why determinism has to be a deliberate requirement, not an assumption.</span>'

    + '<p><span class="en">A compression tool embedding a wall-clock timestamp in metadata, a linker iterating a symbol hash-set in memory-address order, or a multi-threaded processor concatenating results in completion order rather than a fixed order, all three produce different output bytes on different runs, with no bug in the "logic" at all.</span>'
    + '<span class="jp">メタデータに実時間のタイムスタンプを含める圧縮ツール、メモリアドレス順にシンボルのハッシュセットを反復するリンカー、固定順序ではなく完了順に結果を連結するマルチスレッドプロセッサ。この3つはすべて、「ロジック」自体にバグがなくても実行のたびに異なる出力バイトを生成する。</span></p></div>'

    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Detecting non-determinism (verification)</span><span class="jp">非決定性の検知（検証）</span></h3>'
    + '<p><span class="en">Verification means rebuilding from the exact same input twice (or on two machines) and diffing the output hashes. This should run continuously as part of farm health monitoring, not as a one-time audit.</span>'
    + '<span class="jp">検証とは、全く同じ入力から（あるいは異なる2台のマシンで）2回ビルドし、出力ハッシュを比較することである。一度きりの監査ではなく、ファームの健全性モニタリングの一環として継続的に実行すべきである。</span></p>'
    + '<p><span class="en">Sampling a percentage of builds for automatic double-execution catches the problem statistically without doubling farm cost, since a non-deterministic tool fails the check repeatedly, not just once.</span>'

    + '<p><span class="en">If 2% of builds are automatically double-executed and hash-compared, and one shader-compile step fails 40 of its last 50 sampled runs, that\'s a clear, statistically strong signal pointing at a specific toolchain component, found without doubling every build.</span>'
    + '<span class="jp">全ビルドの2%を自動的に二重実行してハッシュ比較しており、特定のシェーダーコンパイルステップが直近50回のサンプルのうち40回で不一致を起こしたとする。これは、すべてのビルドを二重化する必要なく、特定のツールチェーンコンポーネントを指し示す統計的に明確なシグナルである。</span></p></div>'

    + '<h3><span class="en">Fixing it: hermetic, pinned builds</span><span class="jp">修正方法：ハーメティック・固定されたビルド</span></h3>'

    + '<p><span class="en">This is called a "hermetic" build, sealed off from anything not an explicit declared input, so two different machines still produce byte-identical output given the same declared inputs.</span>'

    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Nothing enters the build except what you explicitly declared. "When" and "which machine" should never be visible in the output.</span><span class="jp">明示的に宣言したもの以外は何もビルドに入り込ませない。「いつ」「どのマシン」かは出力から一切見えてはならない。</span></span></div>'

    + '<h3><span class="en">The cost of getting this wrong</span><span class="jp">誤った場合のコスト</span></h3>'
    + '<p><span class="en">Because non-determinism doesn\'t cause visible errors, it\'s one of the most expensive-to-diagnose problems in a build farm. A team can spend months blaming "the cache system" when the root cause is one toolchain quietly producing different output every run.</span>'
    + '<span class="jp">非決定性は目に見えるエラーを起こさないため、ビルドファームにおいて最も診断コストの高い問題の1つである。実際の根本原因が、実行のたびに異なる出力を静かに生成し続ける1つのツールチェーンだったとしても、チームは数ヶ月にわたり「キャッシュシステムの問題」のせいにし続けることがある。</span></p>'
    + '<p><span class="en">Naming determinism as a first-class requirement up front signals you understand where the real risk hides in a system like this, not just how to draw the happy-path architecture.</span>'

    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A studio notices cache hit rate slowly dropping from 85% to 60% over months, adds workers to compensate, and only later traces it to a third-party texture library that started embedding a build UUID in its output header, silently breaking every cache entry that touched it.</span>'
    + '<span class="jp">あるスタジオが、数ヶ月かけてキャッシュヒット率が85%から60%へと徐々に低下していることに気づき、ワーカーを追加して補おうとするが、後になってようやく、出力ヘッダーにビルドUUIDを埋め込むようになったサードパーティ製テクスチャライブラリが原因だったと突き止める。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">A silently degrading hit rate is a determinism bug until proven otherwise.</span><span class="jp">静かに低下し続けるヒット率は、決定性のバグであると証明されるまではそう仮定する。</span></span></div>'

    + '<details class="followup"><summary><span class="en">Can you ever fully guarantee determinism with third-party tools you don\'t control?</span><span class="jp">制御できないサードパーティツールでも、決定性を完全に保証できるのか？</span></summary>'

    + '<details class="followup"><summary><span class="en">How do you convince a team to invest time in this when it adds no visible feature?</span><span class="jp">目に見える機能を追加しないこの取り組みに、チームを投資させるにはどうすればよいか？</span></summary>'

    + '</div>';

  '10-89': function(){ return ''
    + '<div style="'+styleFor('rose')+'">'
    + '<div class="sheet-tag mono">SHEET 7 / 9</div>'
    + '<div class="sheet-eyebrow"><span class="en">1.7 · Fault Tolerance &amp; Observability</span><span class="jp">1.7・耐障害性と可観測性</span></div>'
    + '<h2 class="sec-headline"><span class="en">Expect failure, and measure everything</span><span class="jp">失敗を前提とし、すべてを計測する</span></h2>'
    + '<p class="sec-intro"><span class="en">Everything covered up to this point describes how the system should behave when everything is working correctly, the graph, the cache, the scheduler all doing their jobs as designed. But a real farm running continuously across dozens of machines will never actually run in that ideal state for long. Hardware fails, networks blip, disks fill up, and unpredictable interactions between jobs sharing the same machine happen constantly, none of which is a design flaw, it\'s simply the statistical reality of running anything at this scale for long enough. A system that only works when nothing goes wrong isn\'t actually a finished design, it\'s a design with an unstated assumption baked into every earlier decision. A system this large will have workers die mid-job and caches go stale in ways you can\'t predict. What you can control is how gracefully it recovers, and whether you can even tell when something\'s wrong before it becomes an expensive, months-long problem.</span>'
    + '<span class="jp">ここまで扱ってきたことはすべて、グラフ・キャッシュ・スケジューラーが設計通りにそれぞれの役割を果たしている、すべてが正しく機能している状態でのシステムの振る舞いについてである。しかし、何十台ものマシンで常時稼働する実際のファームが、その理想的な状態を長く保つことは決してない。ハードウェアは故障し、ネットワークは瞬断し、ディスクは満杯になり、同じマシンを共有するジョブ同士の予測できない相互作用が絶えず起こる。これらはどれも設計上の欠陥ではなく、この規模のものを十分長く動かし続ければ必然的に起こる統計的な現実にすぎない。何も問題が起きないときにしか機能しないシステムは、実は完成した設計とは言えず、これまでのすべての判断の中に語られないまま前提として組み込まれてしまっている設計である。これほどの規模のシステムでは、ワーカーがジョブの途中で停止したり、キャッシュが予期せぬ形で古くなったりすることが必ず起こる。制御できるのは、どれだけ優雅に回復できるか、そしてそれが高コストで数ヶ月に及ぶ問題になる前に、そもそも問題に気づけるかどうかである。</span></p>'
    + '<div class="primer">'
    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> Fault tolerance is designing so individual failures, a dead worker, a corrupted cache entry, a network blip, degrade the system gracefully instead of breaking builds. Observability is having the data to know, at a glance, whether the system is actually healthy, not just hoping it is.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>耐障害性とは、個々の障害（ワーカーの停止、キャッシュエントリの破損、ネットワークの瞬断）が起きても、ビルドが壊れたりせずシステムが優雅に劣化するように設計することである。可観測性とは、システムが実際に健全かどうかを一目で把握できるデータを持つことであり、健全であることをただ願うのではない。</span></p>'
    + '<p><span class="en"><strong>Why it matters:</strong> At 50 machines running continuously, failures aren\'t edge cases, they\'re a statistical certainty on any given day. And every fundamental discussed earlier, cache correctness, determinism, is invisible without observability, you can\'t fix what you can\'t see degrading.</span>'
    + '<span class="jp"><strong>重要な理由：</strong>50台のマシンが常時稼働していれば、障害は例外ではなく、ある日には必ず統計的に発生する。そして、これまで議論したキャッシュの正確性や決定性は、可観測性なしには見えない。劣化していることが見えなければ、修正することもできない。</span></p>'
    + '<div class="primer-when">'
    + '<div class="pw-yes"><div class="pw-label"><span class="en">USE IT WHEN</span><span class="jp">使うべき場合</span></div><ul>'
    + '<li><span class="en">A farm runs unattended and continuously, where a single failure shouldn\'t halt everything</span><span class="jp">ファームが無人・常時稼働しており、単一の障害が全体を止めてはならない</span></li>'
    + '<li><span class="en">Non-obvious degradation needs catching before it becomes a months-long crisis</span><span class="jp">目に見えにくい劣化を、数ヶ月に及ぶ危機になる前に検知する必要がある</span></li>'
    + '</ul></div>'
    + '<div class="pw-no"><div class="pw-label"><span class="en">LESS CRITICAL WHEN</span><span class="jp">重要度が下がる場合</span></div><ul>'
    + '<li><span class="en">A tiny local build run interactively by one developer, where failure is immediately visible and manually retried</span><span class="jp">1人の開発者が対話的に実行する小規模ビルドで、障害がすぐ見えて手動で再試行できる</span></li>'
    + '</ul></div>'
    + '</div>'
    + '</div>'
    + '<div class="module" style="--accent:#D1476B;--accent-dark:#7A1E3A;--tint:#F7DCE3">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">Retries with backoff</span><span class="jp">バックオフ付きリトライ</span></h3>'
    + '<p><span class="en">Transient failures, a flaky network blip, a worker briefly starved by a neighboring process, shouldn\'t fail the whole build. Retrying with exponential backoff, waiting longer between each attempt, handles these without hammering an already-struggling resource.</span>'
    + '<span class="jp">一過性の障害（ネットワークの瞬断、隣接プロセスによる一時的なリソース逼迫など）でビルド全体を失敗させるべきではない。指数バックオフ（試行のたびに待機時間を延ばす）付きのリトライは、すでに逼迫しているリソースをさらに叩くことなく対処できる。</span></p>'
    + '<p><span class="en">Distinguish transient from permanent failures. A job failing the same way 5 times in a row is likely a real bug, not a flake, cap retries and surface a real failure after a reasonable number of attempts rather than silently retrying forever.</span>'
    + '<span class="jp">一過性の障害と恒久的な障害を区別する。5回連続で同じ失敗をするジョブは本物のバグである可能性が高い。リトライ回数に上限を設け、一定回数を超えたら本物の失敗として表面化させる。無限に静かにリトライしてはならない。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A worker mid-cook job gets OOM-killed because a neighboring job spiked memory. Retry once immediately, then with backoff if it fails again. If it fails identically 3 times with the same error signature, stop retrying and surface it as a real build failure, not a flake.</span>'
    + '<span class="jp">隣接するジョブがメモリを急増させたため、ワーカーがクック処理の途中でOOM Killされたとする。まず即座に1回リトライし、それでも失敗すればバックオフを入れて再試行する。同じエラーシグネチャで3回連続失敗した場合はリトライを止め、フレークではなく本物のビルド失敗として表面化させる。</span></p></div>'

    + '<div class="module" style="--accent:#D1476B;--accent-dark:#7A1E3A;--tint:#F7DCE3">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Idempotent job design &amp; speculative re-execution</span><span class="jp">冪等なジョブ設計と投機的再実行</span></h3>'
    + '<p><span class="en">Idempotent means running a job twice with the same inputs produces the same safe result. Writing to a content-addressed output key is naturally idempotent, a duplicate write just overwrites with an identical value. This matters because retries and speculative execution both mean a job might genuinely run more than once.</span>'
    + '<span class="jp">冪等とは、同じ入力で同じジョブを2回実行しても同じ安全な結果になることを意味する。コンテンツアドレス方式の出力キーへの書き込みは自然に冪等である。重複した書き込みは同一の値で上書きするだけである。リトライと投機的実行のどちらも、同じジョブが本当に2回実行される可能性があるため、これが重要になる。</span></p>'
    + '<p><span class="en">Speculative re-execution, a straggler mitigation technique, launches a second copy of a suspiciously slow job on a different worker and takes whichever finishes first, killing the loser. This only works safely if the job is idempotent.</span>'

    + '<span class="jp">同一のテクスチャクックジョブ50件のうち49件は約2分で終わるが、1件だけディスクが不安定なワーカーで8分間停止している。無期限に待つのではなく、4分の時点で健全なワーカー上に投機的な複製を起動する。コンテンツアドレス方式の書き込みは両方とも安全に試行できるため、先に終わった方が採用される。</span></p></div>'

    + '<div class="module" style="--accent:#D1476B;--accent-dark:#7A1E3A;--tint:#F7DCE3">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Metrics that actually predict trouble</span><span class="jp">実際にトラブルを予測する指標</span></h3>'
    + '<p><span class="en">Four metrics worth tracking as first-class signals: cache hit rate per tier and project (a slow decay is a determinism bug per 1.6), queue depth per project (rising depth means the fair-share policy isn\'t keeping up), the gap between critical-path duration and actual wall-clock time (a growing gap means something\'s wasting time off the critical path), and worker failure/retry rate.</span>'
    + '<span class="jp">第一級のシグナルとして追跡する価値のある4つの指標：層・プロジェクトごとのキャッシュヒット率（緩やかな低下は1.6の決定性バグを示す）、プロジェクトごとのキュー深さ（増加は公平配分ポリシーが需要に追いついていないことを示す）、クリティカルパス時間と実際の実時間の差（差が広がることは何かが時間を浪費していることを示す）、そしてワーカーの障害・リトライ率である。</span></p>'

    + '<p><span class="en">A fixed threshold alert catches catastrophic failures but misses the slow 85%→60% decay from 1.6\'s determinism example, which never crosses an obvious hard line until it\'s already been a problem for months. Trend-based alerting catches the slow-burn failures threshold alerts are blind to.</span>'
    + '<span class="jp">固定閾値のアラートは破滅的な障害は捉えるが、1.6の決定性の例にあった85%→60%への緩やかな低下は見逃してしまう。これは明確な境界線を超えるまで気づかれない。傾向ベースのアラートは、閾値アラートが見逃す緩慢な障害を捉える。</span></p>'
    + '<p><span class="en">This connects directly to 1.6\'s say-out-loud point: observability is the mechanism that turns a silently degrading hit rate into something someone actually gets paged about before it costs months of wasted compute.</span>'

    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A hit-rate alert firing only below a hard 50% floor would have stayed silent through the entire 85%→60% decay. A trend alert on "hit rate dropped more than 5 points over any rolling 2-week window" would have caught it in week 2, not month 3.</span>'
    + '<span class="jp">50%という固定の下限だけで発火するヒット率アラートは、85%→60%への低下の間ずっと沈黙していたはずである。「任意の2週間のローリングウィンドウでヒット率が5ポイント以上低下した」という傾向アラートであれば、3ヶ月目ではなく2週目にこれを捉えられていた。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Slopes catch what floors miss.</span><span class="jp">傾きは、下限が見逃すものを捉える。</span></span></div>'

    + '<details class="followup"><summary><span class="en">How many retries is too many?</span><span class="jp">リトライは何回までが妥当か？</span></summary>'

    + '<span class="jp">普遍的な数字は存在しない。ジョブのコストに基づいて上限を設ける。安価なジョブは過剰リトライのコストが低いため多めに許容できる。高コストなジョブは早く失敗させて調査に回すべきである。40分かかるジョブを5回リトライすることは、本物のバグかもしれないものを追いかけて実際のキャパシティを無駄にする。</span></div></details>'
    + '<details class="followup"><summary><span class="en">Doesn\'t speculative execution waste capacity by running duplicate work?</span><span class="jp">投機的実行は重複作業でキャパシティを無駄にしていないか？</span></summary>'
    + '<div class="fu-a"><span class="en">Yes, deliberately, and that\'s the trade-off worth naming out loud: it trades a small amount of wasted compute for a much larger amount of saved wall-clock time, almost always a good trade when workers are cheap relative to a developer\'s time.</span>'

  '10-1011': function(){ return ''
    + '<div style="'+styleFor('rust')+'">'

    + '<h2 class="sec-headline"><span class="en">Why game builds break generic build-system assumptions</span><span class="jp">なぜゲームビルドは一般的なビルドシステムの前提を崩すのか</span></h2>'
    + '<p class="sec-intro"><span class="en">Everything covered on the previous sheets, the graph, the cache, the scheduler, fault tolerance, is genuinely general-purpose thinking that applies to distributed build systems for any kind of software. It would be a mistake, though, to treat a games studio\'s build farm as just a generic example of that general thinking, because games break several of its unstated assumptions at once, in ways that change what actually matters in practice. Most conventional build-system thinking was shaped by decades of experience with text-heavy code compilation, where files are small, correctness is mostly binary, and the bottleneck is usually the processor doing the compiling. Game studios deal with an entirely different mix: enormous binary art assets, quality decisions that aren\'t simply right or wrong, and hardware toolchains that fragment the very worker pool the earlier sheets assumed was flexible. Being able to name specifically which of those generic assumptions break, backed by real numbers rather than a vague sense that "games are different," is what separates a memorized answer from real understanding. This sheet is where the general thinking from earlier gets tested against the specific reality of the domain.</span>'
    + '<span class="jp">これまでのシートで扱ってきたグラフ・キャッシュ・スケジューラー・耐障害性は、どんな種類のソフトウェアの分散ビルドシステムにも当てはまる、本当に汎用的な考え方である。しかし、ゲームスタジオのビルドファームを、その汎用的な考え方の単なる一例として扱ってしまうのは誤りである。ゲームは、実務上何が本当に重要かを変えてしまうような形で、その語られない前提のいくつかを同時に崩すためである。従来のビルドシステムに関する考え方の多くは、ファイルが小さく、正しさがおおむね二値であり、ボトルネックが通常コンパイルを行うプロセッサである、テキスト中心のコードコンパイルの何十年もの経験によって形作られてきた。ゲームスタジオが扱うのは全く異なる組み合わせである。巨大なバイナリのアート素材、単純に正しいか間違っているかでは判断できない品質判断、そして前のシートが柔軟だと前提していたワーカープールそのものを断片化させるハードウェアツールチェーンである。「ゲームは違う」という漠然とした感覚ではなく、実際の数字に裏付けられた形で、その汎用的な前提のどれが具体的に崩れるのかを言えることこそが、暗記した答えと本当の理解を分ける。このシートは、これまでの汎用的な考え方を、この領域特有の現実に照らして検証する場である。</span></p>'

    + '<h3><span class="en">I/O-bound, not CPU-bound (the Blizzard case study)</span><span class="jp">I/Oバウンドであり、CPUバウンドではない（Blizzardの事例）</span></h3>'
    + '<p><span class="en">Most software build systems optimize around CPU-bound compilation, more cores roughly means faster builds. Game builds spend most of their wall-clock time moving data: source textures, cooked output, cache transfers, gigabytes rather than kilobytes per job. This flips the bottleneck analysis: network and disk throughput usually matter more than raw core count.</span>'

    + '<h3><span class="en">Capacity math: back-of-envelope worked example</span><span class="jp">容量計算：概算の具体例</span></h3>'
    + '<p><span class="en">Basic queueing intuition: if jobs arrive faster than they\'re completed, the queue grows without bound, no matter how large it currently is. "How many workers do we need" starts from arrival rate vs. service rate, not from a target build time alone.</span>'

    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">Asset cooking vs. code compilation as genuinely distinct problems</span><span class="jp">アセットクックとコードコンパイルは本質的に別の問題である</span></h3>'
    + '<p><span class="en">Recap from 1.2: code compilation is largely deterministic-by-default. Asset cooking often involves lossy, tunable processes, texture compression quality, mesh simplification thresholds, where "correct" isn\'t binary, it\'s a quality/size/performance trade-off decided by an artist, not just a build engineer.</span>'

    + '<div class="dg-turn dg-candidate" style="--accent:#C0281F"><div class="dg-role"><span class="en">CANDIDATE</span><span class="jp">候補者</span></div>'
    + '<p><span class="en">Before I design anything, I\'d want to state the constraints I\'m assuming: mixed job types with very different resource profiles, six to eight tenants needing fair access to the pool, and likely some access isolation requirement between at least some of them if they\'re separate client engagements.</span>'
    + '<span class="jp">何かを設計する前に、まず前提とする制約を整理させてください。リソース特性が大きく異なる複数のジョブタイプ、プールへの公平なアクセスを必要とする6〜8のテナント、そしてもし別々のクライアント案件であれば、少なくとも一部のテナント間でのアクセス分離要件が想定されます。</span></p>'
    + '<p><span class="en">The backbone of the whole system is a dependency graph tracking exactly what depends on what, built from source-control diffs, so I only rebuild what actually changed and what depends on it. Game builds actually carry two graphs, a code graph and a much larger content graph, since textures, meshes, and levels usually dominate.</span>'
    + '<span class="jp">システム全体の背骨となるのは、何が何に依存しているかを正確に追跡する依存関係グラフです。ソース管理の差分から構築し、実際に変更されたものと、それに依存するものだけを再ビルドします。ゲームビルドには実際には2つのグラフがあり、コードグラフと、はるかに大きなコンテンツグラフです。通常、テクスチャ・メッシュ・レベルが大部分を占めます。</span></p>'
    + '<p><span class="en">On top of that graph, the single biggest lever for six to eight related projects is content-addressed caching: hash every input, not just the target name, so identical work anywhere in the farm becomes a cache hit, even across projects that share an engine. I\'d back that with a multi-tier cache, local disk on each worker for the fastest hits, a shared cluster cache for cross-project reuse, and a cold archive for anything long-term.</span>'
    + '<span class="jp">そのグラフの上に、6〜8の関連プロジェクトにとって最大の改善レバーとなるのが、コンテンツアドレス方式のキャッシュです。ターゲット名だけでなくすべての入力をハッシュ化することで、ファーム内のどこで発生した同一の作業も、エンジンを共有するプロジェクト間であってもキャッシュヒットになります。これを多層キャッシュで支えます。最速のヒットのための各ワーカーのローカルディスク、プロジェクト間の再利用のための共有クラスターキャッシュ、そして長期保存のためのコールドアーカイブです。</span></p>'
    + '<p><span class="en">For scheduling, I\'d prioritize the critical path first, since that sets the wall-clock floor regardless of how many workers sit idle elsewhere, pack jobs onto workers based on actual resource footprint rather than treating every slot as interchangeable, and enforce fair-share across the six to eight projects so one team\'s crunch week doesn\'t starve everyone else.</span>'

    + '<p><span class="en">None of this works, though, if the caching is quietly wrong, so I\'d treat determinism as a first-class requirement from day one: pin toolchain versions, strip embedded timestamps, and continuously sample-verify by rebuilding the same input twice and diffing the output hash.</span>'
    + '<span class="jp">ただし、キャッシュが静かに間違っていればこれらはすべて機能しません。そのため決定性を初日から第一級の要件として扱います。ツールチェーンのバージョンを固定し、埋め込まれたタイムスタンプを除去し、同じ入力を2回ビルドして出力ハッシュを比較することで継続的にサンプル検証します。</span></p>'
    + '<p><span class="en">And I\'d build in fault tolerance, retries with backoff for transient failures and speculative re-execution for stragglers, plus observability on the handful of metrics that actually predict trouble: cache hit rate, queue depth per project, and the gap between critical-path duration and actual wall-clock time.</span>'

    + '<p><span class="en">One games-specific point worth naming: this whole system is usually I/O-bound, not CPU-bound, moving gigabytes of texture and mesh data rather than computing on small files, so network and disk throughput to that shared cache tier often matter more than adding raw compute.</span>'
    + '<span class="jp">ゲーム特有の点として1つ触れておきたいのは、このシステム全体は通常CPUバウンドではなくI/Oバウンドだということです。小さなファイルを計算するのではなく、数ギガバイトのテクスチャやメッシュデータを移動させています。そのため、共有キャッシュ層へのネットワークとディスクのスループットが、生の計算力を追加すること以上に重要になることが多いです。</span></p>'
    + '</div>'

    + '<div class="dg-turn dg-interviewer"><div class="dg-role"><span class="en">INTERVIEWER</span><span class="jp">面接官</span></div>'
    + '<p><span class="en">"Why content-hash over just checking timestamps?"</span><span class="jp">「なぜタイムスタンプの確認ではなくコンテンツハッシュを使うのですか？」</span></p></div>'
    + '<div class="dg-turn dg-candidate" style="--accent:#C0281F"><div class="dg-role"><span class="en">CANDIDATE</span><span class="jp">候補者</span></div>'
    + '<p><span class="en">Timestamps break the moment a file is freshly checked out or synced onto a new machine, even with byte-identical content, which triggers false rebuilds. Content hashing only reacts to inputs that actually changed.</span>'

    + '<div class="dg-turn dg-interviewer"><div class="dg-role"><span class="en">INTERVIEWER</span><span class="jp">面接官</span></div>'

    + '<p><span class="en">Determinism testing, periodically rebuilding from the same input twice and diffing the output hash. Any mismatch is a build bug in the toolchain, not something to patch around in the cache layer.</span>'

    + '<div class="dg-turn dg-interviewer"><div class="dg-role"><span class="en">INTERVIEWER</span><span class="jp">面接官</span></div>'
    + '<p><span class="en">"What if one project\'s crunch week floods the queue?"</span><span class="jp">「あるプロジェクトの繁忙期がキューを溢れさせたらどうしますか？」</span></p></div>'
    + '<div class="dg-turn dg-candidate" style="--accent:#C0281F"><div class="dg-role"><span class="en">CANDIDATE</span><span class="jp">候補者</span></div>'

  '7-1': function(){ return ''
    + '<div style="'+styleFor('indigo')+'">'
    + '<div class="sheet-tag mono">SHEET 1 / 4</div>'
    + '<div class="sheet-eyebrow"><span class="en">2.1 · Requirements-Gathering</span><span class="jp">2.1・要件のヒアリング</span></div>'
    + '<h2 class="sec-headline"><span class="en">Ask before you draw</span><span class="jp">描く前に尋ねる</span></h2>'
    + '<p class="sec-intro"><span class="en">A whiteboard prompt like "design a build system for a game studio" is deliberately underspecified, not because the interviewer forgot details, but because how a candidate handles that ambiguity is itself part of what\'s being evaluated. Jumping straight into a diagram without asking anything treats the prompt as if it were a complete specification, when it\'s actually closer to an opening line in a conversation. Real Solutions Architects almost never get a fully-specified problem from a client either, gathering the actual constraints before proposing anything is the job, not a preliminary step before the real job starts. Skipping this stage produces answers that are technically competent but solve a problem the interviewer didn\'t actually ask about, which reads as a communication gap rather than a technical one. The good news is that asking sharp questions is a learnable, repeatable skill with a small set of categories to draw from, not a matter of guessing what the interviewer wants to hear. This sheet covers what to ask, how to ask it efficiently, and how to know when it\'s time to stop asking and start drawing.</span>'
    + '<span class="jp">「ゲームスタジオ向けのビルドシステムを設計してください」のようなホワイトボードのお題は、意図的に情報が不足した状態で出される。面接官が詳細を忘れているからではなく、その曖昧さにどう対応するか自体が評価対象の一部だからである。何も質問せずいきなり図を描き始めることは、そのお題をあたかも完全な仕様であるかのように扱うことになるが、実際にはむしろ会話の第一声に近い。本物のソリューションアーキテクトも、クライアントから完全に仕様化された問題を渡されることはほとんどなく、実際の制約条件を引き出すこと自体が仕事であり、本当の仕事が始まる前の準備段階ではない。この段階を飛ばすと、技術的には的確でも、面接官が実際には尋ねていない問題を解いてしまう回答になり、技術面ではなくコミュニケーション面のギャップとして受け取られてしまう。幸いなことに、鋭い質問をすることは、面接官が何を聞きたいかを推測することではなく、依拠すべき少数のカテゴリーを持つ、学習可能で再現可能なスキルである。このシートでは、何を尋ねるべきか、それをどう効率的に尋ねるか、そしてどの時点で質問をやめて描き始めるべきかを扱う。</span></p>'

    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> Requirements-gathering is asking targeted clarifying questions at the start of a system design answer, before committing to any specific architecture, so the design that follows actually solves the problem being asked rather than an assumed version of it.</span>'
    + '<span class="jp"><strong>簡単に言うと：</strong>要件のヒアリングとは、特定のアーキテクチャに踏み込む前に、システム設計の回答の冒頭で的を絞った確認の質問を行うことであり、これにより、想定した問題ではなく実際に問われている問題を解決する設計につながる。</span></p>'
    + '<p><span class="en"><strong>Why it matters:</strong> Interviewers routinely under-specify prompts on purpose, and the questions a candidate chooses reveal whether they think in trade-offs and constraints or jump to a memorized template. Getting this right early saves time later, since redesigning mid-answer after a wrong assumption costs far more than the 2–3 minutes clarifying questions take up front.</span>'
    + '<span class="jp"><strong>重要な理由：</strong>面接官は意図的にお題の情報を不足させることが多く、候補者がどの質問を選ぶかによって、トレードオフや制約条件で考えているのか、暗記したテンプレートに飛びついているのかが分かる。これを最初に押さえておくことは時間の節約にもなる。誤った前提に気づいて途中で設計をやり直すコストは、最初の2〜3分の確認質問よりはるかに大きい。</span></p>'

    + '<div class="module" style="--accent:#4A5FCC;--accent-dark:#2A3480;--tint:#DEE1F5">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">Functional vs. non-functional requirements</span><span class="jp">機能要件と非機能要件</span></h3>'
    + '<p><span class="en">Functional requirements describe what the system needs to do, rebuild only what changed, support several concurrent projects. Non-functional requirements describe how well it needs to do it, latency targets, availability, cost ceilings, isolation needs. Many candidates only ask about functional scope and forget non-functional targets entirely, which is exactly where senior-level distinctions get made.</span>'
    + '<span class="jp">機能要件とは、システムが何をする必要があるかを示す（変更されたものだけを再ビルドする、複数プロジェクトを同時にサポートするなど）。非機能要件とは、それをどれだけうまく行う必要があるかを示す（レイテンシ目標、可用性、コストの上限、分離要件など）。多くの候補者は機能的な範囲だけを尋ね、非機能的な目標を完全に忘れてしまうが、まさにそこでシニアレベルかどうかの差が生まれる。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Asking "how many projects" (functional scope) is good, but forgetting to ask "what\'s an acceptable wait time for a single-developer build" (a non-functional latency target) means the whole scheduling design later has no actual target to hit.</span>'
    + '<span class="jp">「プロジェクト数はいくつか」（機能的な範囲）と尋ねるのは良いが、「開発者1人のビルドで許容できる待ち時間はどれくらいか」（非機能的なレイテンシ目標）を尋ね忘れると、後のスケジューリング設計全体が、目指すべき実際の目標を持たないままになってしまう。</span></p></div>'

    + '<span><span class="en">Functional is what it does. Non-functional is how well it has to do it. Ask about both.</span><span class="jp">機能要件は何をするか。非機能要件はそれをどれだけうまくやる必要があるか。両方尋ねる。</span></span></div>'

    + '<div class="module" style="--accent:#4A5FCC;--accent-dark:#2A3480;--tint:#DEE1F5">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">The five question categories worth having ready</span><span class="jp">用意しておくべき5つの質問カテゴリー</span></h3>'
    + '<p><span class="en">Scale (how many users/projects/requests), performance targets (latency and throughput numbers), existing constraints (what\'s already built, what can\'t change), failure tolerance (how bad is downtime), and priorities (if trade-offs are needed, what matters most: speed, cost, or simplicity). Having these five memorized means never freezing on "what do I even ask."</span>'
    + '<span class="jp">規模（利用者・プロジェクト・リクエストの数）、性能目標（レイテンシとスループットの数値）、既存の制約（すでに構築済みのもの、変更できないもの）、障害許容度（ダウンタイムはどれだけ深刻か）、優先順位（トレードオフが必要な場合、速度・コスト・シンプルさのどれが最も重要か）。この5つを覚えておけば、「そもそも何を聞けばいいのか」で固まることがなくなる。</span></p>'

    + '<p><span class="en">For the build-system prompt specifically, useful opening questions include: roughly how many developers and how large is the codebase/asset library, what\'s the current build time and the target, is there an existing farm or is this greenfield, and is cost or speed the bigger priority right now.</span>'
    + '<span class="jp">ビルドシステムのお題に限って言えば、有効な最初の質問には次のようなものがある。おおよそ何人の開発者がいて、コードベース・アセットライブラリの規模はどれくらいか。現在のビルド時間と目標は何か。既存のファームがあるのか、それともゼロからの構築か。今は速度とコストのどちらがより優先されるか。</span></p></div>'

    + '<h3><span class="en">Turning a vague prompt into concrete numbers</span><span class="jp">曖昧なお題を具体的な数字に変える</span></h3>'

    + '<h3><span class="en">Knowing when to stop asking and start drawing</span><span class="jp">質問をやめて描き始めるタイミングを知る</span></h3>'
    + '<p><span class="en">Asking too few questions looks careless; asking too many looks like stalling or an inability to make decisions with incomplete information, itself a real-world skill being tested. A good rule: once the major functional scope and the one or two most important non-functional targets are known, move to drawing and state remaining assumptions explicitly as you go.</span>'

    + '<p><span class="en">After 3–4 sharp questions establishing rough scale, a latency target, and whether this is greenfield, it\'s reasonable to say "okay, I think I have enough to start, I\'ll assume X for anything I haven\'t confirmed" and begin the high-level design.</span>'
    + '<span class="jp">おおよその規模、レイテンシ目標、ゼロからの構築かどうかを確認する3〜4個の鋭い質問の後、「では、始めるのに十分な情報が揃ったと思います。確認していない点はXと仮定します」と言い、高レベルな設計を始めるのが妥当である。</span></p></div>'

  '7-3': function(){ return ''
    + '<div style="'+styleFor('coral')+'">'
    + '<div class="sheet-tag mono">SHEET 2 / 4</div>'
    + '<div class="sheet-eyebrow"><span class="en">2.2 · The Design Arc</span><span class="jp">2.2・設計の流れ</span></div>'
    + '<h2 class="sec-headline"><span class="en">High-level first, depth on request</span><span class="jp">まず全体像、深掘りは求められてから</span></h2>'
    + '<p class="sec-intro"><span class="en">Once requirements are clear, a natural instinct for a technically strong candidate is to immediately dive into the most interesting or well-understood part of the system and explain it in full detail. That instinct, while understandable, tends to backfire in an interview setting for a specific reason: the interviewer is trying to evaluate breadth of judgment across an entire system, not depth in one corner of it picked by the candidate rather than by them. A strong answer follows a recognizable arc instead, moving from a high-level sketch of the whole system, through a request-driven deep dive into whichever part actually matters most, and finishing with an explicit discussion of trade-offs and alternatives. This structure also happens to be forgiving of time pressure. A candidate who runs out of time after covering the high-level picture and one deep dive still looks organized, while a candidate who spent the first ten minutes deep in one component with no map of the whole system looks lost, regardless of how correct that one component was. Interviewers frequently interrupt with directional follow-ups specifically to see whether a candidate can flex between altitude levels on demand, staying only at ground level or only at 30,000 feet both read as a gap. This sheet covers how to move through that arc deliberately rather than accidentally.</span>'
    + '<span class="jp">要件が明確になると、技術的に強い候補者にとって自然な衝動は、最も興味深い、あるいは最もよく理解している部分にすぐさま飛び込み、それを詳細に説明することである。その衝動は理解できるが、面接という場ではある特定の理由で裏目に出やすい。面接官が評価しようとしているのは、システム全体にわたる判断の幅であり、候補者自身が選んだ一角における深さではないからである。強い回答はそうではなく、認識しやすい流れをたどる。システム全体の高レベルなスケッチから始まり、実際に最も重要な部分への、求めに応じた深掘りへと進み、最後にトレードオフと代替案についての明示的な議論で締めくくる。この構成は時間的なプレッシャーにも寛容である。高レベルな全体像と1つの深掘りをカバーした後で時間切れになった候補者は、依然として整理されているように見える一方、システム全体の見取り図もないまま最初の10分間を1つのコンポーネントの深掘りに費やした候補者は、その1つのコンポーネントがどれだけ正しくても迷子のように見えてしまう。面接官が意図的に方向性の異なるフォローアップを挟んでくることも多いが、これは候補者が高度を自在に切り替えられるかを確認するためであり、地上レベルだけ、あるいは3万フィート上空だけにとどまることは、どちらもギャップとして受け取られる。このシートでは、この流れを偶然ではなく意図的に進める方法を扱う。</span></p>'

    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'

    + '<span class="jp"><strong>簡単に言うと：</strong>設計の流れとは、強いシステム設計の回答が持つ標準的な3段階の構成である。まず高レベルな概観、次に最も重要な1〜2箇所への深掘り、最後にトレードオフと代替案についての明示的な締めくくりである。</span></p>'

    + '<span class="jp"><strong>重要な理由：</strong>この構成があるからこそ、面接官は限られた時間の中で、幅（システム全体を見渡せるか）と深さ（1つの部分について厳密に推論できるか）の両方を評価できる。どちらかの段階を飛ばすと、これら2つの問いのどちらかが未回答のままになる。</span></p>'

    + '<p><span class="en">The first pass should be a simple sketch: the main pieces and how work flows between them, described in a sentence or two each, not their internals. This gives the interviewer a map to follow and gives the candidate a chance to catch a structural mistake before investing time in details built on a shaky foundation.</span>'

    + '<p><span class="en">Saying out loud "let me start with the high-level flow, then I\'ll go deeper into scheduling since that\'s probably the most interesting part here" does real work. It tells the interviewer what to expect. It makes the structure legible even if they\'re half-listening while taking notes. And it makes it easy for them to redirect if their priorities differ from the candidate\'s guess.</span>'

    + '<span class="jp">面接官からの具体的な誘導がない場合、最良のデフォルトは、必ずしも技術的に最も派手な部分ではなく、本物のトレードオフが最も多い部分を選ぶことである。複数の実際の選択肢があり、そのうち1つが選ばれた実際の理由がある部分は、深掘りの候補として適している。</span></p>'
