    + '<rect x="650" y="138" width="100" height="42" fill="#EDF0F3" stroke="#1B2430" stroke-width="3" stroke-dasharray="5,4"/><text x="700" y="158" text-anchor="middle" fill="#4A5560" font-size="9">MISMATCH</text><text x="700" y="171" text-anchor="middle" fill="#4A5560" font-size="8">= bug</text>'
    + '</g>'
    + '<g stroke="#6E1F57" stroke-width="2.5" fill="none" marker-end="url(#arrowP)">'
    + '<path d="M140,90 L224,41"/><path d="M140,110 L224,159"/><path d="M370,41 L500,80"/><path d="M370,159 L500,100"/><path d="M580,90 L644,41"/><path d="M580,108 L644,159"/>'
    + '</g></svg></div>'
    + '<div class="module" style="--accent:#B23E8C;--accent-dark:#6E1F57;--tint:#F5DFEE">'
    + '<div class="module-num">01 / 04</div>'
    + '<h3><span class="en">What breaks determinism</span><span class="jp">決定性を壊す原因</span></h3>'
    + '<p><span class="en">Common causes: embedded timestamps (compile time or build IDs baked into binaries for debug info), floating-point differences across hardware or optimization levels, uninitialized memory in output, unordered iteration (hash-map order that varies run to run), and multi-threaded processes where output ordering depends on which thread finishes first.</span>'
    + '<span class="jp">よくある原因：埋め込まれたタイムスタンプ（デバッグ情報のためバイナリに焼き込まれるコンパイル時刻やビルドID）、ハードウェアや最適化レベルによる浮動小数点の差異、出力に含まれる未初期化メモリ、順序が保証されない反復処理（実行のたびに変わるハッシュマップの順序）、そしてどのスレッドが先に終わるかで出力順序が変わるマルチスレッド処理。</span></p>'
    + '<p><span class="en">None of these are exotic, they\'re common defaults in general-purpose tools not designed for reproducible builds, which is why determinism has to be a deliberate requirement, not an assumption.</span>'
    + '<span class="jp">これらはどれも特殊な例外ではなく、再現可能なビルドを念頭に設計されていない汎用ツールの一般的なデフォルト挙動である。だからこそ決定性は前提ではなく、意図的な要件として扱う必要がある。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A compression tool embedding a wall-clock timestamp in metadata, a linker iterating a symbol hash-set in memory-address order, or a multi-threaded processor concatenating results in completion order rather than a fixed order, all three produce different output bytes on different runs, with no bug in the "logic" at all.</span>'
    + '<span class="jp">メタデータに実時間のタイムスタンプを含める圧縮ツール、メモリアドレス順にシンボルのハッシュセットを反復するリンカー、固定順序ではなく完了順に結果を連結するマルチスレッドプロセッサ。この3つはすべて、「ロジック」自体にバグがなくても実行のたびに異なる出力バイトを生成する。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">If it\'s not obviously sorted or explicitly pinned, assume it\'s non-deterministic until proven otherwise.</span><span class="jp">明確にソートされているか、明示的に固定されていない限り、証明されるまでは非決定的だと仮定する。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#B23E8C;--accent-dark:#6E1F57;--tint:#F5DFEE">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Detecting non-determinism (verification)</span><span class="jp">非決定性の検知（検証）</span></h3>'
    + '<p><span class="en">Verification means rebuilding from the exact same input twice (or on two machines) and diffing the output hashes. This should run continuously as part of farm health monitoring, not as a one-time audit.</span>'
    + '<span class="jp">検証とは、全く同じ入力から（あるいは異なる2台のマシンで）2回ビルドし、出力ハッシュを比較することである。一度きりの監査ではなく、ファームの健全性モニタリングの一環として継続的に実行すべきである。</span></p>'
    + '<p><span class="en">Sampling a percentage of builds for automatic double-execution catches the problem statistically without doubling farm cost, since a non-deterministic tool fails the check repeatedly, not just once.</span>'
    + '<span class="jp">一定割合のビルドを自動的に二重実行してサンプリングすれば、ファームのコストを倍にすることなく統計的にこの問題を捉えられる。非決定的なツールは一度だけでなく繰り返しこのチェックに失敗するためである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">If 2% of builds are automatically double-executed and hash-compared, and one shader-compile step fails 40 of its last 50 sampled runs, that\'s a clear, statistically strong signal pointing at a specific toolchain component, found without doubling every build.</span>'
    + '<span class="jp">全ビルドの2%を自動的に二重実行してハッシュ比較しており、特定のシェーダーコンパイルステップが直近50回のサンプルのうち40回で不一致を起こしたとする。これは、すべてのビルドを二重化する必要なく、特定のツールチェーンコンポーネントを指し示す統計的に明確なシグナルである。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Sample and compare, don\'t trust and hope.</span><span class="jp">信頼して期待するのではなく、サンプリングして比較する。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#B23E8C;--accent-dark:#6E1F57;--tint:#F5DFEE">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Fixing it: hermetic, pinned builds</span><span class="jp">修正方法：ハーメティック・固定されたビルド</span></h3>'
    + '<p><span class="en">Pin everything that could vary: the toolchain version explicitly, embedded timestamps (many tools support a reproducible-builds mode), sort any iteration touching output order, and sandbox build environments so host differences can\'t leak in.</span>'
    + '<span class="jp">変動しうるものはすべて固定する。ツールチェーンのバージョンを明示的に固定する、埋め込まれたタイムスタンプを固定する（多くのツールには再現可能ビルドモードがある）、出力順序に影響する反復処理をソートする、ホストの差異が漏れ出さないようビルド環境をサンドボックス化する。</span></p>'
    + '<p><span class="en">This is called a "hermetic" build, sealed off from anything not an explicit declared input, so two different machines still produce byte-identical output given the same declared inputs.</span>'
    + '<span class="jp">これは「ハーメティック（密閉的）」ビルドと呼ばれ、明示的に宣言された入力以外から遮断された状態を指す。これにより、全く異なる2台のマシンでも、同じ宣言された入力さえあればバイト単位で同一の出力を生成できる。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Pinning the shader compiler\'s exact version (not "latest"), setting a fixed value instead of real wall-clock time for embedded timestamps, and running each build in a sandbox with only declared inputs mounted removes three of the most common non-determinism sources at once.</span>'
    + '<span class="jp">シェーダーコンパイラのバージョンを（「最新版」ではなく）正確に固定すること、埋め込みタイムスタンプに実際の実時間ではなく固定値を設定すること、宣言された入力のみをマウントしたサンドボックスで各ビルドを実行することで、最も一般的な非決定性の原因のうち3つを一度に取り除ける。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Nothing enters the build except what you explicitly declared. "When" and "which machine" should never be visible in the output.</span><span class="jp">明示的に宣言したもの以外は何もビルドに入り込ませない。「いつ」「どのマシン」かは出力から一切見えてはならない。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#B23E8C;--accent-dark:#6E1F57;--tint:#F5DFEE">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">The cost of getting this wrong</span><span class="jp">誤った場合のコスト</span></h3>'
    + '<p><span class="en">Because non-determinism doesn\'t cause visible errors, it\'s one of the most expensive-to-diagnose problems in a build farm. A team can spend months blaming "the cache system" when the root cause is one toolchain quietly producing different output every run.</span>'
    + '<span class="jp">非決定性は目に見えるエラーを起こさないため、ビルドファームにおいて最も診断コストの高い問題の1つである。実際の根本原因が、実行のたびに異なる出力を静かに生成し続ける1つのツールチェーンだったとしても、チームは数ヶ月にわたり「キャッシュシステムの問題」のせいにし続けることがある。</span></p>'
    + '<p><span class="en">Naming determinism as a first-class requirement up front signals you understand where the real risk hides in a system like this, not just how to draw the happy-path architecture.</span>'
    + '<span class="jp">決定性を最初から第一級の要件として名指しすることは、happy pathのアーキテクチャを描く方法だけでなく、このようなシステムで実際のリスクがどこに潜んでいるかを理解していることを示すシグナルになる。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">A studio notices cache hit rate slowly dropping from 85% to 60% over months, adds workers to compensate, and only later traces it to a third-party texture library that started embedding a build UUID in its output header, silently breaking every cache entry that touched it.</span>'
    + '<span class="jp">あるスタジオが、数ヶ月かけてキャッシュヒット率が85%から60%へと徐々に低下していることに気づき、ワーカーを追加して補おうとするが、後になってようやく、出力ヘッダーにビルドUUIDを埋め込むようになったサードパーティ製テクスチャライブラリが原因だったと突き止める。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">A silently degrading hit rate is a determinism bug until proven otherwise.</span><span class="jp">静かに低下し続けるヒット率は、決定性のバグであると証明されるまではそう仮定する。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">Can you ever fully guarantee determinism with third-party tools you don\'t control?</span><span class="jp">制御できないサードパーティツールでも、決定性を完全に保証できるのか？</span></summary>'
    + '<div class="fu-a"><span class="en">Not always. Some vendor tools genuinely can\'t be pinned or patched. The honest fix is to isolate that tool\'s output from the content-addressed cache entirely, always rebuild it, rather than let it silently poison hit rates elsewhere, and flag it as a known limitation.</span>'
    + '<span class="jp">必ずしも保証できるとは限らない。ベンダー製ツールの中には現実的に固定もパッチもできないものが本当に存在する。誠実な対処は、そのツールの出力をコンテンツアドレス方式キャッシュから完全に切り離し（常に再ビルド扱いにし）、既知の制約として明示的にフラグを立てることである。</span></div></details>'
    + '<details class="followup"><summary><span class="en">How do you convince a team to invest time in this when it adds no visible feature?</span><span class="jp">目に見える機能を追加しないこの取り組みに、チームを投資させるにはどうすればよいか？</span></summary>'
    + '<div class="fu-a"><span class="en">Frame it in terms of the metric they already care about: cache hit rate and average build time. A 20-point hit-rate drop costing X hours of compute per week is a concrete, quantifiable argument.</span>'
    + '<span class="jp">チームがすでに気にしている指標、キャッシュヒット率と平均ビルド時間に落とし込んで説明する。ヒット率が20ポイント低下すると週にX時間分の計算コストがかかっている、という具体的で数値化された主張である。</span></div></details>'
    + '</div>';
  }
};

/* ===================== NAVIGATION ===================== */
function navigate(id){
  currentId = id;
  var content = document.getElementById('content');
  var item = ITEM_INDEX[id];
  if(id==='home'){
    content.innerHTML = homePage();
  } else if(PAGES[id]){
    content.innerHTML = PAGES[id]();
  } else if(item){
    content.innerHTML = placeholderPage(item);
  }
  var crumb = document.getElementById('crumb');
  if(id==='home'){
    crumb.innerHTML = '<span class="en">HOME</span><span class="jp">ホーム</span>';
  } else if(item){
    crumb.innerHTML = item.no+' — <span class="en">'+item.en+'</span><span class="jp">'+item.jp+'</span>';
  }
  var hue = item ? HUES[item.hue || item.group.hue] : HUES.amber;
  document.getElementById('topbar').style.setProperty('--crumb-hue', hue.a);
  renderStatusBtn();
  highlightActive();
  closeRail();
  window.scrollTo(0,0);
  content.scrollTop = 0;
}

/* ===================== LANGUAGE ===================== */
function toggleLang(){
  var html = document.documentElement;
  var next = html.getAttribute('data-lang')==='en' ? 'jp' : 'en';
  html.setAttribute('data-lang', next);
  html.setAttribute('lang', next==='jp' ? 'ja' : 'en');
}

/* ===================== MOBILE RAIL ===================== */
function openRail(){ document.getElementById('rail').classList.add('open'); document.getElementById('railScrim').classList.add('open'); }
function closeRail(){ document.getElementById('rail').classList.remove('open'); document.getElementById('railScrim').classList.remove('open'); }

/* ===================== SEARCH ===================== */
function openSearch(){
  document.getElementById('searchOv').classList.add('open');
  document.getElementById('searchInput').value='';
  document.getElementById('searchInput').focus();
  renderSearch();
}
function closeSearch(){ document.getElementById('searchOv').classList.remove('open'); }
function renderSearch(){
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var isJp = document.documentElement.getAttribute('data-lang')==='jp';
  var results = [];
  COURSE.forEach(function(g){
    g.items.forEach(function(it){
      var hay = (it.en+' '+it.jp+' '+it.no).toLowerCase();
      if(!q || hay.indexOf(q)>-1){ results.push({item:it, group:g}); }
    });
  });
  var box = document.getElementById('searchResults');
  if(results.length===0){
    box.innerHTML = '<div class="ov-empty">'+(isJp?'一致するシートが見つかりません':'No matching sheets')+'</div>';
    return;
  }
  var html='';
  results.forEach(function(r){
    var hue = HUES[r.item.hue || r.group.hue];
    html += '<button class="ov-row" style="--it-hue:'+hue.a+'" onclick="navigate(\''+r.item.id+'\');closeSearch();">'
      + '<span class="rowdot"></span>'
      + '<span style="flex:1;min-width:0;">'
      + '<div class="rowgroup">'+(isJp?r.group.jpName:r.group.enName)+'</div>'
      + '<div>'+r.item.no+' — '+(isJp?r.item.jp:r.item.en)+'</div>'
      + '</span></button>';
  });
  box.innerHTML = html;
}
function flatOrder(){
  var ids = ['home'];
  COURSE.forEach(function(g){ g.items.forEach(function(it){ ids.push(it.id); }); });
  return ids;
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeSearch(); closeRail(); }
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); openSearch(); }
  if((e.key==='ArrowRight' || e.key==='ArrowLeft') && document.activeElement.tagName!=='INPUT' && !document.getElementById('searchOv').classList.contains('open')){
    var order = flatOrder();
    var idx = order.indexOf(currentId);
    if(idx===-1) return;
    var nextIdx = e.key==='ArrowRight' ? idx+1 : idx-1;
    if(nextIdx>=0 && nextIdx<order.length){ navigate(order[nextIdx]); }
  }
});

/* ===================== INIT ===================== */
(async function init(){
  await loadProgress();
  renderRail();
  navigate('home');
})();
</script>
