    + '<div class="module" style="--accent:#5B7A94;--accent-dark:#33495C;--tint:#DDE6EC">'
    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Live-ops telemetry and analytics pipeline</span><span class="jp">ライブ運用のテレメトリ・分析パイプライン</span></h3>'
    + '<p><span class="en">The core challenge is ingesting a continuous, high-volume stream of gameplay events from millions of concurrent players and turning it into something usable, dashboards, alerts, matchmaking signals, without falling behind the incoming data or losing events during failures.</span>'
    + '<span class="jp">中核となる課題は、何百万人もの同時プレイヤーからの継続的で大量なゲームプレイイベントのストリームを取り込み、それをダッシュボード・アラート・マッチメイキング用シグナルなど使えるものに変換することであり、入ってくるデータに遅れを取らず、障害中にイベントを失わないことである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Applying the toolkit</span><span class="jp">道具箱の応用</span></div>'
    + '<p><span class="en">Dependency structure becomes the processing pipeline stages (raw events → cleaned/validated → aggregated → queryable); caching becomes pre-aggregating common queries; scheduling becomes prioritizing latency-sensitive signals over less time-sensitive ones; fault tolerance becomes ensuring no player events get silently dropped during a processing failure, often via a durable retrying queue.</span>'
    + '<span class="jp">依存構造は処理パイプラインの段階（生イベント→クレンジング・検証済み→集計済み→クエリ可能）になる。キャッシュは、よくあるクエリの事前集計になる。スケジューリングは、時間的制約の緩いシグナルよりレイテンシに敏感なシグナルを優先することになる。耐障害性は、処理障害中にプレイヤーイベントが静かに失われないことになり、多くの場合、再試行可能な永続キューによって実現される。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Same shape, applied to a continuous stream of events instead of a batch of build jobs.</span><span class="jp">同じ形を、ビルドジョブのバッチではなく、連続的なイベントのストリームに適用する。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#5B7A94;--accent-dark:#33495C;--tint:#DDE6EC">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Real-time matchmaking</span><span class="jp">リアルタイムマッチメイキング</span></h3>'
    + '<p><span class="en">The core challenge is grouping players into fair, low-latency matches from a constantly changing pool of waiting players, balancing match quality against wait time, since waiting too long for a "perfect" match is often worse than an imperfect match delivered quickly.</span>'
    + '<span class="jp">中核となる課題は、絶えず変化する待機プレイヤーのプールから、公平で低レイテンシなマッチにプレイヤーをグループ分けし、マッチの質と待ち時間のバランスを取ることである。「完璧な」マッチを長く待つことは、迅速に提供される不完全なマッチよりも悪いことが多いためである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Applying the toolkit</span><span class="jp">道具箱の応用</span></div>'
    + '<p><span class="en">Scheduling and fair-share is almost the entire problem here. Deciding which waiting players get matched together, and in what order, is a direct cousin of build-job scheduling. Capacity math reappears directly too, since matchmaking has the exact same arrival-rate-vs-service-rate queueing logic as the build farm. Fault tolerance becomes handling a player disconnecting mid-match-formation without breaking the match for everyone else.</span>'
    + '<span class="jp">スケジューリングと公平配分がほぼ問題の全体を占める。どの待機プレイヤーをどの順序で組み合わせるかを決めることは、ビルドジョブのスケジューリングの直系のいとこである。容量計算もそのまま再登場する。マッチメイキングはビルドファームと全く同じ到着率対処理率のキューイング論理を持つためである。耐障害性は、他の全員のマッチを壊すことなく、マッチ形成の途中でプレイヤーが切断した場合の対処になる。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">The build farm\'s scheduler and the matchmaker\'s scheduler are solving structurally the same problem with different objects.</span><span class="jp">ビルドファームのスケジューラーとマッチメイカーのスケジューラーは、構造的に同じ問題を、異なる対象で解いている。</span></span></div>'
    + '</div>'
    + '<div class="module" style="--accent:#5B7A94;--accent-dark:#33495C;--tint:#DDE6EC">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">The transfer method for any new, unfamiliar prompt</span><span class="jp">未知の新しいお題への転用方法</span></h3>'
    + '<p><span class="en">When an entirely new prompt lands cold, a repeatable move is to ask the same five questions regardless of domain. What depends on what, that\'s the graph question. What work is likely to repeat and could be reused, that\'s the caching question. How is limited capacity shared fairly, that\'s the scheduling question. What fails and how does it recover gracefully, that\'s the fault-tolerance question. And what\'s genuinely unique about this domain that a generic answer would miss, that\'s the domain-specific question.</span>'
    + '<span class="jp">全く新しいお題がその場で出されたとき、再現可能な動きは、領域に関わらず同じ5つの質問をすることである。何が何に依存しているか、これがグラフの問いである。どの作業が繰り返され再利用できそうか、これがキャッシュの問いである。限られたキャパシティをどう公平に共有するか、これがスケジューリングの問いである。何が失敗し、どう優雅に復旧するか、これが耐障害性の問いである。そして、汎用的な答えでは見落としてしまう、この領域に本当に特有なものは何か、これが領域特有の問いである。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Even a completely unfamiliar prompt like "design a friend-list and social graph system" can be approached this way. What depends on what: a friendship needs consistency on both sides. What\'s cacheable: a friend list is read far more often than it\'s written. How is capacity shared: by protecting against one user spamming requests. What fails: a partial write, if one side of a friendship link succeeds and the other doesn\'t.</span>'
    + '<span class="jp">「フレンドリストとソーシャルグラフのシステムを設計してください」のような全く未知のお題でさえ、この方法でアプローチできる。何が何に依存しているか（友人関係は双方の一貫性を必要とする）、何がキャッシュ可能か（フレンドリストは書き込みよりはるかに多く読み取られる）、キャパシティはどう共有されるか（1人のユーザーがリクエストを乱発するのを防ぐ）、何が失敗するか（リンクの片側は成功し片側は失敗した場合の部分的な書き込み）。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Five questions, asked in the same order, turn any unfamiliar prompt into a structured starting point: graph, cache, schedule, recover, domain-specific twist.</span><span class="jp">同じ順序で問う5つの質問が、どんな未知のお題も構造化された出発点に変える。グラフ、キャッシュ、スケジュール、復旧、領域特有のひねり。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">What if the new prompt is in a domain I genuinely know nothing about, like payments or authentication?</span><span class="jp">決済や認証のような、本当に何も知らない領域のお題だったら？</span></summary>'
    + '<div class="fu-a"><span class="en">The five-question method still applies, the "domain-specific twist" question is exactly the placeholder for whatever is unfamiliar, and it\'s fine to flag that specific piece as an honest unknown while still applying the general structure confidently to the rest.</span>'
    + '<span class="jp">5つの質問の方法はそれでも適用できる。「領域特有のひねり」の問いは、まさになじみのないものそのもののための枠である。その特定の部分は正直に未知として明示しつつ、残りには汎用的な構造を自信を持って適用すればよい。</span></div></details>'
    + '<details class="followup"><summary><span class="en">How much should I actually prepare on scenarios I\'m not sure will come up?</span><span class="jp">出るかどうか分からないシナリオに、実際どれだけ備えるべきか？</span></summary>'
    + '<div class="fu-a"><span class="en">Depth on the flagship matters more than breadth across many scenarios, this sheet is meant to prove the toolkit transfers, not to become nine more sheets deep on every possible prompt, a light pass here is enough.</span>'
    + '<span class="jp">多くのシナリオにわたる幅広さよりも、旗艦テーマの深さの方が重要である。このシートは道具箱が転用できることを証明するためのものであり、あらゆるお題についてさらに9枚分の深さを構築するためのものではない。ここでは軽く目を通す程度で十分である。</span></div></details>'
    + '<div class="say-out-loud"><div class="mono"><span class="en">Say this out loud</span><span class="jp">面接でそのまま口に出す一言</span></div>'
    + '<p><span class="en">"This isn\'t a domain I\'ve built a system for directly, but let me apply the same approach I\'d use for any distributed system: what depends on what, what can be cached, how is capacity shared fairly, and what happens when something fails."</span>'
    + '<span class="jp">「これは直接システムを構築したことのある領域ではありませんが、どんな分散システムにも使う同じアプローチを適用させてください。何が何に依存しているか、何をキャッシュできるか、キャパシティをどう公平に共有するか、そして何かが失敗したときどうなるか、という点です。」</span></p></div>'
    + '</div>';
  }
};

/* ===================== NAVIGATION ===================== */
function navigate(id){
  currentId = id;
  var content = document.getElementById('content');
  var item = ITEM_INDEX[id];
  if(id==='home'){
    content.innerHTML = homePage();
  } else if(PAGES[id]){
    content.innerHTML = PAGES[id]();
  } else if(item){
    content.innerHTML = placeholderPage(item);
  }
  var crumb = document.getElementById('crumb');
  if(id==='home'){
    crumb.innerHTML = '<span class="en">HOME</span><span class="jp">ホーム</span>';
  } else if(item){
    crumb.innerHTML = item.no+' — <span class="en">'+item.en+'</span><span class="jp">'+item.jp+'</span>';
  }
  var hue = item ? HUES[item.hue || item.group.hue] : HUES.amber;
  document.getElementById('topbar').style.setProperty('--crumb-hue', hue.a);
  renderStatusBtn();
  highlightActive();
  closeRail();
  window.scrollTo(0,0);
  content.scrollTop = 0;
}

/* ===================== LANGUAGE ===================== */
function toggleLang(){
  var html = document.documentElement;
  var next = html.getAttribute('data-lang')==='en' ? 'jp' : 'en';
  html.setAttribute('data-lang', next);
  html.setAttribute('lang', next==='jp' ? 'ja' : 'en');
}

/* ===================== MOBILE RAIL ===================== */
function openRail(){ document.getElementById('rail').classList.add('open'); document.getElementById('railScrim').classList.add('open'); }
function closeRail(){ document.getElementById('rail').classList.remove('open'); document.getElementById('railScrim').classList.remove('open'); }

/* ===================== SEARCH ===================== */
function openSearch(){
  document.getElementById('searchOv').classList.add('open');
  document.getElementById('searchInput').value='';
  document.getElementById('searchInput').focus();
  renderSearch();
}
function closeSearch(){ document.getElementById('searchOv').classList.remove('open'); }
function renderSearch(){
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var isJp = document.documentElement.getAttribute('data-lang')==='jp';
  var results = [];
  COURSE.forEach(function(g){
    g.items.forEach(function(it){
      var hay = (it.en+' '+it.jp+' '+it.no).toLowerCase();
      if(!q || hay.indexOf(q)>-1){ results.push({item:it, group:g}); }
    });
  });
  var box = document.getElementById('searchResults');
  if(results.length===0){
    box.innerHTML = '<div class="ov-empty">'+(isJp?'一致するシートが見つかりません':'No matching sheets')+'</div>';
    return;
  }
  var html='';
  results.forEach(function(r){
    var hue = HUES[r.item.hue || r.group.hue];
    html += '<button class="ov-row" style="--it-hue:'+hue.a+'" onclick="navigate(\''+r.item.id+'\');closeSearch();">'
      + '<span class="rowdot"></span>'
      + '<span style="flex:1;min-width:0;">'
      + '<div class="rowgroup">'+(isJp?r.group.jpName:r.group.enName)+'</div>'
      + '<div>'+r.item.no+' — '+(isJp?r.item.jp:r.item.en)+'</div>'
      + '</span></button>';
  });
  box.innerHTML = html;
}
function flatOrder(){
  var ids = ['home'];
  COURSE.forEach(function(g){ g.items.forEach(function(it){ ids.push(it.id); }); });
  return ids;
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeSearch(); closeRail(); }
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); openSearch(); }
  if((e.key==='ArrowRight' || e.key==='ArrowLeft') && document.activeElement.tagName!=='INPUT' && !document.getElementById('searchOv').classList.contains('open')){
    var order = flatOrder();
    var idx = order.indexOf(currentId);
    if(idx===-1) return;
    var nextIdx = e.key==='ArrowRight' ? idx+1 : idx-1;
    if(nextIdx>=0 && nextIdx<order.length){ navigate(order[nextIdx]); }
  }
});

/* ===================== INIT ===================== */
(async function init(){
  await loadProgress();
  renderRail();
  navigate('home');
})();
</script>
</body>
