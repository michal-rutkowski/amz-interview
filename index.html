    + '<div class="module" style="--accent:#7A2048;--accent-dark:#4A1230;--tint:#EDD8E0">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">Performance efficiency &amp; cost optimization</span><span class="jp">パフォーマンス効率とコスト最適化</span></h3>'
    + '<p><span class="en">Performance efficiency asks whether resources are being used well for what\'s actually needed, not just "is it fast," since over-provisioning wastes money while under-provisioning creates a real performance problem. Cost optimization asks whether the money spent is actually buying proportional value, these two dimensions are almost always discussed together because they pull against each other.</span>'
    + '<span class="jp">パフォーマンス効率は、単に「速いか」ではなく、実際に必要なものに対してリソースがうまく使われているかを問う。過剰にプロビジョニングすればお金が無駄になり、不足すれば本物の性能問題を生む。コスト最適化は、支払われているお金が実際に見合った価値を買えているかを問う。この2つの次元は互いに引っ張り合うため、ほぼ常に一緒に議論される。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Recall 3.3\'s compute/storage matching discussion, choosing a bigger, more expensive machine "just in case" when a smaller one comfortably handles the actual load is a performance-efficiency and cost-optimization failure at the same time, not two separate problems.</span>'
    + '<span class="jp">3.3のコンピュート・ストレージのマッチングの議論を思い出してほしい。小さいマシンで実際の負荷を快適に処理できるのに、念のためとより大きく高価なマシンを選ぶことは、2つの別々の問題ではなく、パフォーマンス効率とコスト最適化の両方の失敗を同時に意味する。</span></p></div>'

    + '<span><span class="en">Ask not just "is this fast enough" but "is this exactly as fast as it needs to be, and no more expensively than that."</span><span class="jp">「これは十分速いか」だけでなく、「これはまさに必要なだけ速く、それ以上に高くはないか」を問う。</span></span></div>'

    + '<div class="module" style="--accent:#7A2048;--accent-dark:#4A1230;--tint:#EDD8E0">'
    + '<div class="module-num">04 / 04</div>'
    + '<h3><span class="en">Sustainability, and naming trade-offs explicitly</span><span class="jp">持続可能性、そしてトレードオフを明示的に名指しする</span></h3>'
    + '<p><span class="en">Sustainability asks about the ongoing resource footprint of a design, over-provisioned or poorly-utilized infrastructure has a real environmental cost, not just a financial one. More broadly, explicitly naming which of these six dimensions a specific trade-off is actually about is a concrete way to sound senior when closing out a design.</span>'
    + '<span class="jp">持続可能性は、設計の継続的な資源負荷について問う。過剰にプロビジョニングされた、あるいはうまく活用されていないインフラは、金銭的だけでなく実際の環境的コストを伴う。より広く言えば、特定のトレードオフが実際にこれら6つの次元のどれについてのものかを明示的に名指しすることは、設計を締めくくる際にシニアらしく聞こえる具体的な方法である。</span></p>'
    + '<div class="module-example"><div class="ex-label"><span class="en">Worked example</span><span class="jp">具体例</span></div>'
    + '<p><span class="en">Choosing to keep three redundant copies of critical data (a reliability and security choice) instead of one is explicitly a trade against cost optimization and sustainability, naming that trade directly, rather than treating "more redundancy" as free, is exactly the explicit reasoning 2.2 argued for.</span>'
    + '<span class="jp">重要なデータの冗長コピーを1つではなく3つ保持することを選ぶこと（信頼性とセキュリティの選択）は、明示的にコスト最適化と持続可能性との引き換えである。「冗長性を増やす」ことを無料であるかのように扱うのではなく、その取引を直接名指しすることこそが、まさに2.2が求めていた明示的な推論である。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Name which of the six dimensions a trade-off is actually trading between, that\'s what turns "I chose X" into a defensible design decision.</span><span class="jp">トレードオフが実際に6つの次元のどれとどれの間で行われているかを名指しする。それこそが「私はXを選びました」を、擁護できる設計判断に変える。</span></span></div>'
    + '</div>'
    + '<details class="followup"><summary><span class="en">Isn\'t it impossible to fully satisfy all six dimensions at once?</span><span class="jp">6つすべての次元を同時に完全に満たすことは不可能ではないか？</span></summary>'
    + '<div class="fu-a"><span class="en">Yes, and that tension is the whole point, a strong design doesn\'t pretend to maximize all six, it names which ones it\'s prioritizing for this specific system and why, and which it\'s consciously trading away.</span>'

    + '<details class="followup"><summary><span class="en">Which dimension matters most?</span><span class="jp">どの次元が最も重要か？</span></summary>'
    + '<div class="fu-a"><span class="en">There\'s no universal answer, it depends entirely on what\'s actually at stake for that specific system, a payments system likely prioritizes security and reliability over cost; an internal analytics dashboard might prioritize cost over raw performance.</span>'

    + '<p><span class="en">"Before finalizing this design, I\'d want to check it against a few dimensions explicitly, not just whether it works: can it actually be operated day to day, is it secure by design, does it survive failure, is it cost-proportional to its performance, and what\'s its ongoing resource footprint."</span>'

    + '</div>';
  },

    + '<p class="sec-intro"><span class="en">Everything covered so far in this handbook has been about designing something, whether new or as a general pattern, but a huge amount of real Solutions Architect work involves the opposite starting point: an existing system, already running, already carrying real business value and real technical debt, that needs to move somewhere new. It\'s tempting to treat "migration" as a single action with one obvious approach, lift the thing up and put it down somewhere else, but that instinct misses that migration actually comes in several genuinely different strategies with very different amounts of effort, risk, and payoff, and picking the wrong one for a given system is a real, costly mistake. This matters specifically for this role\'s JD, which explicitly emphasizes leading technical strategy across existing organizational context and multiple teams, not just designing greenfield systems from a blank page. Recognizing which strategy fits which system, and being comfortable with the idea that different systems in the same migration effort legitimately warrant different strategies, is a distinct, transferable skill from system design itself. This sheet works through that spectrum of strategies from lowest to highest effort, and the equally important decision of when not to migrate a system at all.</span>'

    + '<p><span class="en">The simplest strategy moves a system with little to no change to how it actually works internally, fastest and lowest-risk, but it also carries forward any existing problems the old system had. A step up makes small, targeted changes during the move, like switching a compute or storage shape (3.3), without a full redesign.</span>'

    + '<p><span class="en">At the far end, a system gets substantially rebuilt from the ground up, highest effort and risk, but potentially the biggest long-term payoff. The other end of this same spectrum is deciding a system shouldn\'t be migrated at all, either because it should be retired, or kept exactly where it is since migrating it isn\'t worth the cost.</span>'

    + '<p><span class="en">A large organization migrating doesn\'t pick one single strategy for everything, different systems within the same migration effort often use different strategies depending on each system\'s specific business value, technical debt, and urgency, treating migration as one uniform action is itself a mistake.</span>'

    + '<details class="followup"><summary><span class="en">How do you decide which strategy fits a given system?</span><span class="jp">どの戦略が特定のシステムに合うかをどう判断するか？</span></summary>'
    + '<div class="fu-a"><span class="en">Weigh the system\'s business value, how much technical debt or existing limitation it carries, and urgency, a high-value system with real existing problems justifies more redesign effort than a low-value, rarely-touched one.</span>'
    + '<span class="jp">システムのビジネス価値、抱えている技術的負債や既存の制約の量、そして緊急性を比較検討する。実際の既存の問題を抱える高価値のシステムは、低価値でめったに触れられないシステムより多くの再設計の労力を正当化する。</span></div></details>'

    + '<p class="sec-intro"><span class="en">This sheet exists for a specific, direct reason: the job description for this role explicitly names design and proposal experience with data and AI infrastructure, including generative AI, as a preferred qualification, which makes it a real gap worth closing rather than an optional extra. It\'s tempting to treat this area as a completely separate universe requiring entirely new concepts, but the more useful framing, and the one that actually holds up under a follow-up question, is that data and AI infrastructure is the same set of fundamentals covered throughout this whole handbook, applied to a new and currently fast-growing kind of workload. A data pipeline is a specific instance of the async processing and service-boundary thinking from 3.2, a training job has real scheduling and resource-allocation considerations shaped like the build farm\'s own job scheduling (1.5), and a system serving AI-generated answers to users needs the exact same statelessness property from 3.1 to scale horizontally. This sheet is intentionally conceptual rather than deep, since architectural reasoning about data flow, resource needs, and scaling patterns transfers even without hands-on machine learning modeling expertise, and being honest about that specific boundary, while reasoning confidently about the infrastructure and architecture side, is a legitimate, credible position to hold in this kind of conversation.</span>'

    + '<div class="primer-label"><span class="en">Start here — the basics</span><span class="jp">まずはここから ― 基礎知識</span></div>'
    + '<p><span class="en"><strong>In plain terms:</strong> Data infrastructure moves, stores, and processes data at scale, built for analyzing large volumes over time, not just serving individual requests. AI infrastructure is what\'s needed to train and run machine learning models, training and inference are two genuinely different phases with very different resource needs. Generative AI refers to models that produce new content rather than just classifying or predicting a single value.</span>'

    + '<p><span class="en">A data pipeline takes raw data from where it\'s generated and moves it through stages, cleaning it, combining it with other data, and making it queryable, similar in shape to the live-ops telemetry pipeline from 2.4. Batch processing handles data in large chunks on a schedule, while streaming handles data continuously, a real trade-off between simplicity and how fresh the resulting insights need to be.</span>'

    + '<span class="jp">どのゲームレベルの離脱率が最も高いかについての週次レポートは、夜間のバッチジョブとして妥当に実行できる。しかし、今のサーバーの健全性を示すライブダッシュボードはストリーミング処理を必要とする。1日古いレポートは「今この瞬間」のビューという目的を損なうためである。</span></p></div>'
    + '<div class="module-model"><span class="mm-label"><span class="en">MENTAL MODEL</span><span class="jp">思考モデル</span></span>'
    + '<span><span class="en">Batch is a weekly grocery trip. Streaming is grabbing what you need the moment you need it. Pick based on how stale an answer is allowed to be.</span><span class="jp">バッチは週1回の買い出しである。ストリーミングは必要な瞬間に必要なものをつかむことである。答えがどれだけ古くても許されるかに基づいて選ぶ。</span></span></div>'

    + '<div class="module-num">02 / 04</div>'
    + '<h3><span class="en">Training vs. inference: two very different resource needs</span><span class="jp">訓練対推論：非常に異なる2つのリソース需要</span></h3>'
    + '<p><span class="en">Training a model, teaching it from a large dataset, is extremely resource-intensive and typically happens in large, infrequent bursts. Inference, using an already-trained model to produce an answer for one specific input, is comparatively lightweight per request but needs to be fast and happen constantly, at high volume, if it\'s user-facing.</span>'
    + '<span class="jp">モデルを訓練すること、つまり大規模なデータセットから学習させることは、極めて多くのリソースを消費し、通常は頻度は低いが大規模なバーストとして行われる。推論、つまりすでに訓練済みのモデルを使って1つの特定の入力に対する答えを生成することは、リクエストあたりでは比較的軽量だが、ユーザー向けであれば、速く、絶えず、大量に行われる必要がある。</span></p>'

    + '<div class="module" style="--accent:#9B7FD4;--accent-dark:#5C4590;--tint:#EDE5F7">'
    + '<div class="module-num">03 / 04</div>'
    + '<h3><span class="en">What generative AI means, and a common application pattern</span><span class="jp">生成AIの意味と、よくあるアプリケーションパターン</span></h3>'
    + '<p><span class="en">Generative AI models produce new content rather than just classifying or predicting a number. A common practical pattern for using them reliably is retrieval-augmented generation (RAG), where the model is given specific, relevant, up-to-date information alongside the question, rather than relying purely on what it learned during training, which can be outdated or too general.</span>'
    + '<span class="jp">生成AIモデルは、単に分類したり数字を予測したりするのではなく、新しいコンテンツを生み出す。それらを確実に使うためのよくある実践的なパターンは、検索拡張生成（RAG）である。これは、訓練中に学習した、古くなっているか一般的すぎる可能性のあるものだけに頼るのではなく、質問と一緒に、具体的で関連性が高く最新の情報をモデルに与える方式である。</span></p>'

    + '<p><span class="en">None of this is actually disconnected from the rest of the handbook, a data pipeline is a specific instance of the async/queue pattern from 3.2, a training job has scheduling considerations similar in shape to the build farm\'s job scheduling (1.5), and a RAG system\'s retrieval step depends on the kind of fast lookup that indexing (3.4) and caching (1.3) already covered.</span>'

  'IX-1': function(){ return ''
    + '<div style="'+styleFor('moss')+'">'
    + '<div class="sheet-tag mono">FINAL SHEET</div>'
    + '<div class="sheet-eyebrow"><span class="en">5.1 · Bridging Your Own Experience</span><span class="jp">5.1・実務経験との接続</span></div>'

    + '<p class="sec-intro"><span class="en">Every fundamental covered across this entire handbook has a real-world echo somewhere in a candidate\'s own past work, even work that never used cloud terminology at all, and finding that echo deliberately, rather than hoping it surfaces naturally in the moment, is what turns abstract technical fluency into a concrete, credible interview story. Interviewers for a senior, customer-facing role are evaluating not just whether a candidate understands these concepts in the abstract, but whether they\'ve actually reasoned about real trade-offs before, under real constraints, with real consequences, which is a genuinely different thing to demonstrate than reciting a definition correctly. This sheet is deliberately the last one in the handbook, and deliberately different in kind from everything before it, it introduces no new technical concept, it\'s a method for making everything already covered personally retrievable under pressure. The exercise here is general enough that it applies to any reader\'s own background, not tied to any specific industry or company, since the translation skill itself, recognizing a familiar-shaped problem underneath unfamiliar terminology, is what actually transfers. Doing this exercise once, calmly, before an interview, is the difference between confidently retrieving the right story and searching for one live, under pressure, for the first time.</span>'

    + '<div class="rehearse-note"><span class="en"><strong>How to use this sheet:</strong> Read through the four modules below, then, on your own, work through each major fundamental in this handbook, requirements-gathering, caching, scheduling, fault tolerance, security, consistency, and ask the translating question from Module 1 for each. Keep the results as a short private list, not something written into this site.</span>'
    + '<span class="jp"><strong>このシートの使い方：</strong>以下の4つのモジュールを読み通した後、自分自身で、このハンドブックの主要な基礎知識、要件のヒアリング、キャッシュ、スケジューリング、耐障害性、セキュリティ、整合性のそれぞれについて、モジュール1の翻訳の問いを当てはめてみてほしい。結果は、このサイトに書き込むものではなく、短い個人的なリストとして持っておく。</span></div>'

    + '<p><span class="en">For each fundamental, ask a simple translating question: "when have I had to make a similar trade-off, even if I didn\'t call it this at the time?" Most technical experience, even outside formal software engineering, involves versions of these same patterns: prioritizing limited resources, deciding what to trust versus verify, handling something failing partway through.</span>'
    + '<span class="jp">それぞれの基礎知識について、シンプルな翻訳の問いを立てる。「当時はこう呼んでいなかったとしても、いつ似たようなトレードオフを迫られたことがあるか？」正式なソフトウェアエンジニアリングの外であっても、ほとんどの技術的な経験は、限られたリソースの優先順位付け、何を信頼し何を検証すべきか決めること、途中で何かが失敗した際の対処といった、同じパターンの版を含んでいる。</span></p>'

    + '<span class="jp">文字通りのビルドファームを構築したことがない人でも、繁忙期にチームの限られたキャパシティを管理した経験はあるかもしれない。当時はそういう言葉で捉えていなかったとしても、これは1.5の公平配分スケジューリングの問題の、実際に生きられた本物の一例である。</span></p></div>'

    + '<span class="jp">バックアップシステムへの切り替えによって解決されたサービス障害についての、強く具体的な記憶は、「常に信頼性について考えている」という漠然とした一般的な主張よりも、はるかに信頼できる形で耐障害性とフェイルオーバー（3.7、1.7）を示している。具体性こそが、そのつながりを響かせる。</span></p></div>'

    + '<div class="module" style="--accent:#5C7A52;--accent-dark:#374A30;--tint:#DEE8D6">'

    + '<span class="jp">「この全く同じキャッシュパターンでシステムを構築したことはありませんが、何をすぐ使える状態にしておき、何を必要に応じて再生成するかを決める、非常によく似たトレードオフを行ったことはあります」と言う方が、実際にはない直接的な経験をほのめかすよりも、より強く信頼できる回答である。</span></p></div>'

/* ===================== NAVIGATION ===================== */
function navigate(id){
  currentId = id;
  var content = document.getElementById('content');
  var item = ITEM_INDEX[id];
  if(id==='home'){
    content.innerHTML = homePage();
  } else if(PAGES[id]){
    content.innerHTML = PAGES[id]();
  } else if(item){
    content.innerHTML = placeholderPage(item);
  }
  var crumb = document.getElementById('crumb');
  if(id==='home'){
    crumb.innerHTML = '<span class="en">HOME</span><span class="jp">ホーム</span>';
  } else if(item){
    crumb.innerHTML = item.no+' — <span class="en">'+item.en+'</span><span class="jp">'+item.jp+'</span>';
  }
  var hue = item ? HUES[item.hue || item.group.hue] : HUES.amber;
  document.getElementById('topbar').style.setProperty('--crumb-hue', hue.a);
  renderStatusBtn();
  highlightActive();
  closeRail();
  window.scrollTo(0,0);
  content.scrollTop = 0;
}

/* ===================== LANGUAGE ===================== */
function toggleLang(){
  var html = document.documentElement;
  var next = html.getAttribute('data-lang')==='en' ? 'jp' : 'en';
  html.setAttribute('data-lang', next);
  html.setAttribute('lang', next==='jp' ? 'ja' : 'en');
}

/* ===================== MOBILE RAIL ===================== */
function openRail(){ document.getElementById('rail').classList.add('open'); document.getElementById('railScrim').classList.add('open'); }
function closeRail(){ document.getElementById('rail').classList.remove('open'); document.getElementById('railScrim').classList.remove('open'); }

/* ===================== SEARCH ===================== */
function openSearch(){
  document.getElementById('searchOv').classList.add('open');
  document.getElementById('searchInput').value='';
  document.getElementById('searchInput').focus();
  renderSearch();
}
function closeSearch(){ document.getElementById('searchOv').classList.remove('open'); }
function renderSearch(){
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var isJp = document.documentElement.getAttribute('data-lang')==='jp';
  var results = [];
  COURSE.forEach(function(g){
    g.items.forEach(function(it){
      var hay = (it.en+' '+it.jp+' '+it.no).toLowerCase();
      if(!q || hay.indexOf(q)>-1){ results.push({item:it, group:g}); }
    });
  });
  var box = document.getElementById('searchResults');
  if(results.length===0){
    box.innerHTML = '<div class="ov-empty">'+(isJp?'一致するシートが見つかりません':'No matching sheets')+'</div>';
    return;
  }
  var html='';
  results.forEach(function(r){
    var hue = HUES[r.item.hue || r.group.hue];
    html += '<button class="ov-row" style="--it-hue:'+hue.a+'" onclick="navigate(\''+r.item.id+'\');closeSearch();">'
      + '<span class="rowdot"></span>'
      + '<span style="flex:1;min-width:0;">'
      + '<div class="rowgroup">'+(isJp?r.group.jpName:r.group.enName)+'</div>'
      + '<div>'+r.item.no+' — '+(isJp?r.item.jp:r.item.en)+'</div>'
      + '</span></button>';
  });
  box.innerHTML = html;
}
function flatOrder(){
  var ids = ['home'];
  COURSE.forEach(function(g){ g.items.forEach(function(it){ ids.push(it.id); }); });
  return ids;
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeSearch(); closeRail(); }
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); openSearch(); }
  if((e.key==='ArrowRight' || e.key==='ArrowLeft') && document.activeElement.tagName!=='INPUT' && !document.getElementById('searchOv').classList.contains('open')){
    var order = flatOrder();
    var idx = order.indexOf(currentId);
    if(idx===-1) return;
    var nextIdx = e.key==='ArrowRight' ? idx+1 : idx-1;
    if(nextIdx>=0 && nextIdx<order.length){ navigate(order[nextIdx]); }
  }
});

/* ===================== INIT ===================== */
(async function init(){
  await loadProgress();
  renderRail();
  navigate('home');
})();
</script>
</body>
</html>
